    <script>
        let CF = null, SHOW_PRICE = false, SCOPE_TXT = '', rows = [], items = [], racks = [], tab = 'stores', isAdmin = false, canEdit = false, _userEmail = '', currentId = null;
        function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
        function num(v) { const n = parseFloat(v); return isNaN(n) ? 0 : n; }
        function fmt(n) { return Math.round(num(n)).toLocaleString(); }
        function money(n) { const v = num(n); return (v > 0 ? '+' : '') + fmt(v); }
        function fdate(ts) { const d = new Date(ts); return isNaN(d) ? '-' : d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short' }); }
        function ambCls(f) { return f === 'Over' ? 'bg-red-100 text-red-700' : f === 'Watch' ? 'bg-amber-100 text-amber-800' : f === 'OK' ? 'bg-emerald-100 text-emerald-700' : 'bg-slate-100 text-slate-500'; }
        const GRADE = { '1': 'ดี', '2': 'พอใช้', '3': 'แย่' };

        document.addEventListener('DOMContentLoaded', function() {
            try { const u = JSON.parse(localStorage.getItem('app_user_data') || 'null'); if (u && localStorage.getItem('app_auth_token')) _userEmail = u.email || ''; } catch (e) {}
            loadAll();
            if (_userEmail) google.script.run.withSuccessHandler(function(f) {
                if (!f) return;
                isAdmin = !!(f.isAdmin || f.isScheduleAdmin); canEdit = isAdmin || !!f.smfEditAllowed || !!f.opsEditAllowed;
                document.getElementById('deleteBtn').classList.toggle('hidden', !isAdmin);
                document.getElementById('refreshLayoutBtn').classList.toggle('hidden', !canEdit);
                document.getElementById('syncUnitsBtn').classList.toggle('hidden', !canEdit);
                document.getElementById('fullManualBtn').classList.toggle('hidden', !f.isAdmin);   // Super Admin only (server re-checks)
            }).getUserFlags(_userEmail);
        });
        // Full manual (budget / BOQ / report) — server returns a signed 12 h link only for Super Admin.
        function openFullManual(btn) {
            const w = window.open('', '_blank');   // open now so the popup isn't blocked after the async call
            btn.disabled = true;
            google.script.run.withSuccessHandler(function(res) {
                btn.disabled = false;
                if (res && res.success) { if (w) w.location.href = res.url; else window.open(res.url, '_blank'); }
                else { if (w) w.close(); alert((res && res.error) || 'เปิดไม่สำเร็จ'); }
            }).withFailureHandler(function(err) { btn.disabled = false; if (w) w.close(); alert(err.message); }).getFfrFullManualLink(_userEmail);
        }
        let _gen = 0;
        function loadAll() {
            const g = ++_gen; let pending = 2;
            const done = function() { if (--pending === 0 && g === _gen) document.getElementById('mainLoader').classList.add('hidden'); };
            document.getElementById('mainLoader').classList.remove('hidden');
            const call = function(fn, onOk, tries) {
                google.script.run.withSuccessHandler(function(res) {
                    if (g !== _gen) return;
                    if (!res && tries < 3) { setTimeout(function() { call(fn, onOk, tries + 1); }, 1500); return; }
                    if (!res || !res.success) { alert('โหลดข้อมูลไม่สำเร็จ (' + fn + '): ' + (res && res.error)); done(); return; }
                    onOk(res); done();
                }).withFailureHandler(function(err) { if (g === _gen) { alert('Error (' + fn + '): ' + err.message); done(); } })[fn](window.ARCHIVE_ON, _userEmail);
            };
            call('getFfRenovateOverview', function(res) {
                CF = res.ffConfig; rows = res.rows || []; SHOW_PRICE = !!res.showPrice;   // prices: Super Admin only (server decides + strips)
                // store scope: admins / schedule admin / SMF = all stores; anyone else = only stores where they are AMM MTN (server-filtered)
                const sb = document.getElementById('scopeBanner');
                SCOPE_TXT = res.scopeAll ? '' : (res.scopeN ? 'แสดงเฉพาะสาขาที่คุณรับผิดชอบ (AMM MTN) — ' + res.scopeN + ' สาขา'
                    : (_userEmail ? 'ไม่พบสาขาในโครงการที่คุณเป็น AMM MTN (' + _userEmail + ') — ถ้าไม่ถูกต้อง แจ้ง Admin ให้ตรวจ ID AMM ในฐานข้อมูลสาขา' : 'กรุณาเข้าสู่ระบบในแอปหลักก่อน เพื่อดูรายงานสาขาที่คุณรับผิดชอบ'));
                sb.textContent = SCOPE_TXT;
                sb.className = SCOPE_TXT ? 'rounded-lg border px-4 py-2 text-sm ' + (res.scopeN ? 'bg-sky-50 border-sky-200 text-sky-900' : 'bg-amber-50 border-amber-200 text-amber-900') : 'hidden';
                document.getElementById('layoutFolderBtn').href = res.layoutFolder;
                const teams = Array.from(new Set(rows.map(function(r) { return r.team; }).filter(Boolean))).sort();
                const sel = document.getElementById('fTeam'), cur = sel.value;
                sel.innerHTML = '<option value="">ทุกทีม</option>' + teams.map(function(t) { return '<option' + (t === cur ? ' selected' : '') + '>' + esc(t) + '</option>'; }).join('');
                renderAll();
            }, 0);
            call('getFfRenovateItemRows', function(res) { items = res.items || []; racks = res.racks || []; renderAll(); }, 0);
        }
        function setTab(t) {
            tab = t;
            document.querySelectorAll('[data-tab]').forEach(function(b) { b.classList.toggle('tab-on', b.dataset.tab === t); b.classList.toggle('text-rose-800', b.dataset.tab !== t); });
            ['stores', 'items', 'racks'].forEach(function(k) { document.getElementById('view-' + k).classList.toggle('hidden', k !== t); });
        }
        function _match(r) {
            const team = document.getElementById('fTeam').value, st = document.getElementById('fState').value, q = document.getElementById('fText').value.toLowerCase().trim();
            if (team && r.team !== team) return false;
            if (st === 'done' && !r.sv) return false;
            if (st === 'todo' && r.sv) return false;
            if (st === 'nolayout' && r.layouts) return false;
            if (st === 'full' && !r.full) return false;
            if (st === 'instrisk' && !(r.sv && r.sv['Install Risks'])) return false;
            if (st === 'pmflag' && !(r.pm && r.pm.flags && r.pm.flags.length)) return false;
            if (q && (r.code + ' ' + r.gold + ' ' + r.name).toLowerCase().indexOf(q) === -1) return false;
            return true;
        }
        function renderAll() { if (!CF) return; renderKpis(); renderStores(); renderItems(); renderRacks(); }
        function renderKpis() {
            const sv = rows.filter(function(r) { return r.sv; });
            const s = function(k) { return sv.reduce(function(a, r) { return a + num(r.sv[k]); }, 0); };
            const boqRef = rows.reduce(function(a, r) { return a + r.boq.refQ; }, 0), boqNew = rows.reduce(function(a, r) { return a + r.boq.newQ; }, 0),
                  boqTot = SHOW_PRICE ? rows.reduce(function(a, r) { return a + num(r.boq.total); }, 0) : 0;
            const k = function(l, v, sub, c) { return '<div class="kpi"><div class="text-xs text-slate-500">' + l + '</div><div class="text-2xl font-bold ' + (c || 'text-slate-900') + '">' + v + '</div><div class="text-[11px] text-slate-500">' + (sub || '') + '</div></div>'; };
            document.getElementById('kpis').innerHTML =
                k('ตรวจแล้ว', sv.length + ' / ' + rows.length, 'สาขา · มี Layout ' + rows.filter(function(r) { return r.layouts; }).length, 'text-rose-700') +
                (SHOW_PRICE ? k('BOQ รวม', (boqTot / 1e6).toFixed(1) + ' MB', 'Refurbish ' + boqRef + ' ตู้') : k('แผน BOQ', fmt(boqRef) + ' / ' + fmt(boqNew), 'ตู้ Refurbish / ซื้อใหม่')) +
                k('Refurbish ยืนยัน', fmt(s('BOQ Refurbish Confirmed')) + ' / ' + fmt(s('BOQ Refurbish Qty')), 'จากแผนของสาขาที่ตรวจแล้ว', 'text-emerald-700') +
                k('Workable / New', fmt(s('Qty Workable')) + ' / ' + fmt(s('Qty Request New')), 'ตู้', 'text-sky-700') +
                (SHOW_PRICE ? k('งบเทียบ BOQ', money(s('Cost Delta vs BOQ (THB)')), '฿ (+ ต้องเพิ่ม / − ประหยัด)', s('Cost Delta vs BOQ (THB)') > 0 ? 'text-red-700' : 'text-emerald-700')
                            : k('ไม่พบ / Rack เสนอเปลี่ยน', fmt(s('Qty Not Found')) + ' / ' + fmt(s('Rack Replace')), 'ตู้ / ชุด', 'text-slate-700')) +
                k('ร้อนเกิน / Rack เปลี่ยน', sv.filter(function(r) { return r.sv['Ambient Flag'] === 'Over'; }).length + ' / ' + fmt(s('Rack Replace')), 'สาขา > ' + CF.ambMax + '°C / Rack', 'text-amber-700');
        }
        // BOQ revision the survey was checked against; amber when older than the BOQ now loaded (re-check changed lines)
        function _boqRevTag(rev) {
            const cur = CF && CF.boqRev ? CF.boqRev : '', r = String(rev || '').trim();
            if (!r) return '<div class="text-[10px] font-normal text-slate-400" title="ส่งก่อนมีการบันทึก BOQ Rev">BOQ R0</div>';
            const old = cur && r !== cur;
            return '<div class="text-[10px] ' + (old ? 'font-semibold text-amber-700' : 'font-normal text-slate-400') + '" title="' + (old ? 'ตรวจกับ BOQ ' + esc(r) + ' — ตอนนี้ใช้ ' + esc(cur) + ' ควรตรวจรายการที่เปลี่ยน' : 'ตรวจกับ BOQ ' + esc(r)) + '">BOQ ' + esc(r.split(' · ')[0]) + (old ? ' ⚠' : '') + '</div>';
        }
        // PM contract baseline (FfRenovatePm.gs): refrigerant + rack age · lease left (red < 5 yrs) · flags (hover for the list)
        function _pmCell(pm) {
            if (!pm) return '<td class="p-2 text-[10px] text-slate-400">ไม่มีใน PM</td>';
            const fl = pm.flags || [];
            return '<td class="p-2 text-[11px] whitespace-nowrap">' + esc(pm.refg || '-') + (pm.rackYr ? ' · Rack ' + pm.rackAge + ' ปี' : '') +
                (pm.remain > 0 ? '<div class="' + (pm.remain < 5 ? 'text-red-600 font-semibold' : 'text-slate-500') + '">เช่าเหลือ ' + pm.remain + ' ปี</div>' : '<div class="text-slate-400">' + esc(pm.own || '') + '</div>') +
                (fl.length ? '<div class="text-amber-700 font-semibold" title="' + esc(fl.map(function(f) { return '• ' + f.m; }).join('\n')) + '">⚠ ' + fl.length + ' ข้อสังเกต</div>' : '') + '</td>';
        }
        function renderStores() {
            const list = rows.filter(_match).sort(function(a, b) { return (a.sv ? 1 : 0) - (b.sv ? 1 : 0) || a.team.localeCompare(b.team) || a.name.localeCompare(b.name); });
            let h = '<table class="min-w-full text-xs"><thead class="bg-slate-50 text-slate-500"><tr><th class="text-left p-2">สาขา</th><th class="p-2">ทีม / Model</th><th class="p-2">Layout</th><th class="p-2">BOQ Ref / New</th>' + (SHOW_PRICE ? '<th class="p-2">BOQ ฿</th>' : '') + '<th class="p-2 text-left">ข้อมูล PM / สัญญา</th>' +
                '<th class="p-2">ตรวจ</th><th class="p-2">Ambient max</th><th class="p-2">Refurbish / Workable / New / ไม่พบ</th>' + (SHOW_PRICE ? '<th class="p-2">งบเทียบ BOQ</th>' : '') + '<th class="p-2">Rack ใช้ต่อ/OH/เปลี่ยน</th><th class="text-left p-2">ระบบที่แนะนำ</th><th class="text-left p-2">แอร์ / ไฟ / ติดตั้ง</th></tr></thead><tbody>';
            list.forEach(function(r) {
                const v = r.sv;
                h += '<tr class="border-t border-slate-100 hover:bg-rose-50/40 ' + (v ? 'cursor-pointer' : '') + '"' + (v ? ' data-open="' + esc(v.ID) + '"' : '') + '>' +
                    '<td class="p-2"><b>' + esc(r.gold) + '</b> ' + esc(r.name) + (r.full ? ' <span class="px-1.5 rounded bg-amber-100 text-amber-800 text-[10px] font-semibold">Full Renovate</span>' : '') + '<div class="text-[10px] text-slate-400">' + esc(r.code) + (r.amm ? ' · ' + esc(r.amm) : '') + '</div></td>' +

            if (eqk.length) h += '<div><h3 class="font-bold mb-1">อุปกรณ์ห้องเตรียม</h3><div class="text-xs flex flex-wrap gap-1">' + eqk.map(function(k) { const e = (res.ffConfig.equip || []).find(function(x) { return x.k === k; }); return '<span class="px-2 py-0.5 rounded border">' + esc(e ? e.l : k) + ': ใช้ได้ ' + (eq[k].ok || 0) + ' · ซ่อม ' + (eq[k].fix || 0) + ' · ขอใหม่ ' + (eq[k].nw || 0) + '</span>'; }).join('') + '</div></div>';
            if (d['Has Broken'] === 'Yes') h += '<p class="text-red-700 text-xs">🚨 ' + esc(d['Broken Detail']) + '</p>';
            if (d.Comments) h += '<p class="text-xs bg-slate-50 rounded p-2">💬 ' + esc(d.Comments) + '</p>';
            document.getElementById('modalBody').innerHTML = h;
        }
        function closeModal() { document.getElementById('modal').classList.add('hidden'); currentId = null; }
        function deleteRecord() {
            if (!currentId || !confirm('ลบรายการ ' + currentId + '?')) return;
            google.script.run.withSuccessHandler(function(res) { if (res && res.success) { closeModal(); loadAll(); } else alert('ลบไม่สำเร็จ: ' + (res && res.error)); }).deleteFfRenovateSurveyRecord(currentId, _userEmail);
        }
        // Unit register (FfRenovateUnits.gs): one QR per cabinet unit — built on submit; this backfills / refreshes all stores
        function syncUnits(btn) {
            btn.disabled = true; btn.textContent = '⏳ กำลังสร้าง QR...';
            google.script.run.withSuccessHandler(function(r) {
                btn.disabled = false; btn.textContent = '⟳ สร้าง/อัปเดต QR';
                if (!r || !r.success) { alert((r && r.error) || 'ไม่สำเร็จ'); return; }
                alert('รหัสตู้ / QR: ' + r.stores + ' สาขา · สร้างใหม่ ' + r.created + ' · อัปเดต ' + r.updated + ' · ยกเลิก ' + r.cancelled);
            }).withFailureHandler(function(e) { btn.disabled = false; btn.textContent = '⟳ สร้าง/อัปเดต QR'; alert(e.message); }).syncFfrUnitsFromSurveys(_userEmail);
        }
        function refreshLayouts(btn) {
            btn.disabled = true; btn.textContent = '⏳ กำลังสแกน...';
            google.script.run.withSuccessHandler(function(res) {
                btn.disabled = false; btn.textContent = '⟳ สแกน Layout';
                if (res && res.success) { alert('พบไฟล์ Layout ' + res.files + ' ไฟล์ · ' + res.stores + ' สาขา\n\nตั้งชื่อไฟล์ขึ้นต้นด้วยรหัสสาขา เช่น 11112_Suratthani.pdf หรือ 112_Suratthani.pdf แล้ววางในโฟลเดอร์ Fresh Food Survey'); loadAll(); }
                else alert('ไม่สำเร็จ: ' + (res && res.error));
            }).withFailureHandler(function(err) { btn.disabled = false; btn.textContent = '⟳ สแกน Layout'; alert(err.message); }).refreshFfrLayouts(_userEmail);
        }
        // ── Print ──
        // Whole report: header (date, tab, filters) + KPIs + the open tab, A4 landscape. Uses the on-screen filters.
        function printReport() {
            const TAB = { stores: 'สาขา', items: 'ตู้แช่ (รวมทุกสาขา)', racks: 'Rack' };
            const fT = document.getElementById('fTeam'), fS = document.getElementById('fState'), q = document.getElementById('fText').value.trim();
            const flt = [fT.value ? 'ทีม ' + fT.value : 'ทุกทีม', fS.options[fS.selectedIndex].text].concat(q ? ['ค้นหา "' + q + '"'] : []);
            document.getElementById('printHdr').innerHTML = '<div style="display:flex;justify-content:space-between;align-items:flex-end">' +
                '<div><b style="font-size:13pt;color:#881337">รายงานสำรวจก่อน Renovate Fresh Food — FF Renovation 2027</b><br><span style="font-size:8.5pt;color:#475569">มุมมอง: ' + esc(TAB[tab] || tab) + ' · ' + esc(flt.join(' · ')) + (window.ARCHIVE_ON ? ' · รวมข้อมูล Archive' : '') + (SCOPE_TXT ? ' · ' + esc(SCOPE_TXT) : '') + '</span></div>' +
                '<div style="font-size:8pt;color:#475569;text-align:right">พิมพ์ ' + new Date().toLocaleString('th-TH') + (SHOW_PRICE ? '<br><b style="color:#be123c">มีข้อมูลงบประมาณ — Super Admin เท่านั้น</b>' : '') + '</div></div>';
            document.body.classList.remove('print-modal');
            window.print();
        }
        // Only the open record window (one store).
        function printRecord() {
            document.body.classList.add('print-modal');
            const off = function() { document.body.classList.remove('print-modal'); window.removeEventListener('afterprint', off); };
            window.addEventListener('afterprint', off);
            window.print();
            setTimeout(off, 1500);   // some browsers skip afterprint in iframes
        }
        // Price / budget columns (any key with "THB") only for Super Admin — the server doesn't send them otherwise anyway.
        function _np(o) { if (!SHOW_PRICE) Object.keys(o).forEach(function(k) { if (/THB/.test(k)) delete o[k]; }); return o; }
        function downloadToExcel(btn) {
            if (btn) { btn.disabled = true; }
            google.script.run.withSuccessHandler(function(r) { if (btn) btn.disabled = false; _writeExcel((r && r.success && r.units) || []); })
                .withFailureHandler(function() { if (btn) btn.disabled = false; _writeExcel([]); }).getFfrUnits(_userEmail, '', true);
        }
        function _writeExcel(units) {
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows.map(function(r) { return _np((function() {
                const v = r.sv || {};
                return { 'Oracle': r.code, 'Gold': r.gold, 'Store': r.name, 'Team': r.team, 'Model': r.model, 'AMM': r.amm, 'Layouts': r.layouts, 'BOQ Refurbish Qty': r.boq.refQ, 'BOQ New Qty': r.boq.newQ, 'BOQ Total THB': r.boq.total,
                         'Surveyed': r.sv ? 'Yes' : 'No', 'Survey ID': v.ID || '', 'BOQ Rev': v['BOQ Rev'] || (r.sv ? 'R0' : ''), 'Survey Date': v['Survey Date'] || '', 'Inspector': v['Reporter Name'] || '', 'Layout Status': v['Layout Status'] || '', 'Ambient Max C': v['Ambient Max (C)'] || '', 'Ambient Flag': v['Ambient Flag'] || '',
                         'Refurbish OK': v['Qty Refurbish OK'] || 0, 'Workable': v['Qty Workable'] || 0, 'Request New': v['Qty Request New'] || 0, 'Not Found': v['Qty Not Found'] || 0, 'Cost Delta vs BOQ THB': v['Cost Delta vs BOQ (THB)'] || 0, 'Scrap cabinets': v['Scrap Cabinets'] || 0, 'Partial WO cards': v['Partial WO Cards'] || 0, 'Asset No missing': v['Asset No Missing'] || 0,
                         'Rack Keep': v['Rack Keep'] || 0, 'Rack Overhaul': v['Rack Overhaul'] || 0, 'Rack Replace': v['Rack Replace'] || 0, 'System Recommend': v['System Recommend'] || '', 'High Frozen System': v['High Frozen System'] || '', 'Site Risks': v['Site Risks'] || '',
                         'Full Renovate': r.full ? 'Yes' : 'No', 'AC Type': v['AC Type'] || '', 'AC TR': v['AC TR'] || '', 'AC Load %': v['AC Load (%)'] || '', 'Chiller Spare': v['Chiller Spare'] || '',
                         'Transformer kVA': v['Transformer kVA'] || '', 'MDB Headroom %': v['MDB Headroom (%)'] || '', 'Cooling Hint': v['Cooling Hint'] || '', 'Install Risks': v['Install Risks'] || '',
                         'PM Ownership': r.pm ? r.pm.own : '', 'PM Lease Left (yrs)': r.pm ? r.pm.remain : '', 'PM Contract End': r.pm ? r.pm.endMA : '',
                         'PM Refrigerant': r.pm ? r.pm.refg : '', 'PM Rack Install Year': r.pm ? r.pm.rackYr : '', 'PM Rack Age': r.pm ? r.pm.rackAge : '',
                         'PM High Frozen': r.pm ? r.pm.hfz : '', 'PM Flags': r.pm ? (r.pm.flags || []).map(function(f) { return f.m; }).join(' | ') : '' };
            })()); })), 'Stores');
            XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(items.map(function(it) { return _np((function() {
                return { 'Gold': it.gold, 'Store': it.sn || '', 'Team': it.team, 'Card': it.iid, 'Equip Code': it.ec || '', 'Category': it.cat, 'Cabinet': it.name, 'System': it.sys, 'Position': it.pos, 'BOQ Plan': it.plan, 'Qty': it.q,
                         'Refurbish': it.qRef, 'Workable': it.qWork, 'Request New': it.qNew, 'Not Found': it.qNone, 'Body': GRADE[it.body] || '', 'Cooling': GRADE[it.cool] || '', 'Door': GRADE[it.door] || '', 'Year': it.yr, 'Temp C': it.tm,
                         'CMS repairs 12m': it.rep, 'Repair cost': it.repCost, 'Reason new': it.why, 'Scrap (remove) qty': it.qNew, 'Equipment IDs': it.eq || '', 'Asset No (FAS)': it.asset, 'Write-off type': it.wo, 'Note': it.nt, 'Refurbish THB/unit': it.pr, 'New THB/unit': it.pn, 'Photos': it.photos };
            })()); })), 'Cabinets');
            XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(racks.map(function(rk) {
                return { 'Gold': rk.gold, 'Store': rk.name, 'Rack': rk.rid, 'Type': rk.type, 'Brand': rk.brand, 'Model': rk.model, 'Year': rk.yr, 'Refrigerant': rk.refg, 'Compressors': rk.comp, 'Working': rk.compOk,
                         'Condition': GRADE[rk.cond] || '', 'Condenser': GRADE[rk.cdu] || '', 'Leak': rk.leak, 'Control': rk.ctrl, 'Spare capacity': rk.spare, 'Repairs 12m': rk.rep, 'Repair cost': rk.repCost, 'Recommendation': rk.rec, 'Spare HP/kW': rk.spareHp, 'Spare circuits': rk.spareCirc, 'Fits new Remote': rk.fit, 'Asset No (FAS)': rk.asset, 'Write-off type': rk.wo, 'Feeds': rk.feeds, 'Note': rk.nt, 'Photo 1': (rk.photos || [])[0] || '' };
            })), 'Racks');
            if (units.length) XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(units), 'Units (QR)');
            XLSX.writeFile(wb, 'FF_Renovate_Survey_' + new Date().toISOString().substring(0, 10) + '.xlsx');
        }
