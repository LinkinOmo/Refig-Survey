<script type="module">

  });

}
function qrTex(code, col) {

    c.fillStyle = '#111'; const n = 13, s = 10, ox = 35, oy = 26;

const STORE = grp(scene);
{ const gnd = new THREE.Mesh(new THREE.PlaneGeometry(220, 220), mat(0xaeb8c2, { roughness: 1 })); gnd.rotation.x = -Math.PI / 2; gnd.receiveShadow = true; scene.add(gnd);
  const fl = new THREE.Mesh(new THREE.PlaneGeometry(14, 10), mat(0xf3efe6, { roughness: .85 })); fl.rotation.x = -Math.PI / 2; fl.position.y = .012; fl.receiveShadow = true; STORE.add(fl); }

plate(STORE, 2.6, .9, '#16a34a', [['Mini Big C', .5, '#fff']], 8.8, 4.55, 4.28, { glow: .5, ry: Math.PI });

function buildChiller(g, x, z, s = 1) {

[[-2.5, -1.2], [-2.5, 1.6]].forEach(([x, z]) => { box(STORE, 6.4, 1.5, .9, 0xd1d5db, x, 0, z); for (let r = 0; r < 3; r++) for (let k = 0; k < 22; k++) [-1, 1].forEach(sd => box(STORE, .26, .3, .06, [0xef4444, 0xfbbf24, 0x10b981, 0x3b82f6, 0xf472b6][(r + k) % 5], x - 3 + k * .285, .15 + r * .45, z + sd * .47)); });
box(STORE, 1.8, .95, .7, 0x334155, 4.6, 0, 3.4); box(STORE, .5, .3, .4, 0x0f172a, 4.2, .95, 3.4);

const LIGHTS = [];
[[-4.2, -2.6], [-1.2, -2.6], [1.8, -2.6], [-4.2, .2], [-1.2, .2], [1.8, .2]].forEach(([x, z]) => { const m = box(STORE, 1.3, .07, .26, 0xffffff, x, 3.0, z, { emissive: 0xffffff, emissiveIntensity: .9 }); LIGHTS.push(m); });

tube(STORE, [[-6.4, 2.1, -3], [-6.4, 3.12, -3], [-5.2, 3.12, -2.7], [2.6, 3.12, -2.7], [2.6, 3.12, .1], [-4.8, 3.12, .1]], .045, cableMat);

const AX = [-5.5, -3, -.5, 2, 4.5], CAP = [36, 36, 24, 24, 18];
const pipeMat = new THREE.MeshStandardMaterial({ color: 0xb87333, metalness: .6, roughness: .35, emissive: 0xff6a00, emissiveIntensity: 0 });
const ACIN = [], CDU = [];
AX.forEach((x, i) => {

  const fan = cyl(cd, .25, .02, 0x334155, -.16, 0, 0); fan.rotation.x = Math.PI / 2; fan.position.set(-.16, .44, -.2);
  const fg = new THREE.Mesh(new THREE.TorusGeometry(.26, .02, 6, 24), mat(0x64748b)); fg.position.set(-.16, .44, -.205); cd.add(fg);
  CDU.push(cd);

});

const HL = new THREE.Mesh(new THREE.BoxGeometry(1.25, .55, .45), hlMat); HL.position.set(AX[0], 2.77, -4.86); scene.add(HL);

const QR = new THREE.Mesh(new THREE.PlaneGeometry(.26, .325), qrMat); QR.position.set(AX[0] + .24, .48, -6.245); QR.rotation.y = Math.PI; scene.add(QR);
// cost pile + coins + share bars

// ───────────── CABINET: 18 drawers = 18 Categories ─────────────
const CX = 20, CAB = grp(scene, CX, 0, 0);

const CATS = [['C01', 'Refrigeration', 'ทำความเย็น'], ['C02', 'Electrical', 'ไฟฟ้า'], ['C03', 'HVAC', 'ปรับอากาศ'], ['C04', 'Sanitary', 'สุขาภิบาล'], ['C05', 'Fresh Food Equip.', 'อุปกรณ์ของสด'], ['C06', 'Civil & Architecture', 'โยธา / สถาปัตย์'],

    if (j >= 0) { parts = P(['SKS30', ''], ...D[j]); on = { c: 1, s: 1, t: 1, m: 1, st: 1 }; } else { parts = P(['SKS30', ''], ['C??', ''], ['S???', ''], ['T???', ''], ['M????', '']); }
  } else if (ph === 'add') {
    parts = P(['', ''], ['C06', 'Civil & Architecture'], ['S012', 'โครงสร้างอาคาร (ใหม่)'], ['T001', 'Building structure'], ['M0001', '']);
    on = { c: 1, s: lt >= F('add', .55) + 1.0, t: lt >= F('add', .55) + 1.0 };
  }
  const el = $('code');
  if (!parts) { el.style.display = 'none'; return; }
  el.style.display = 'flex';
  el.innerHTML = parts.filter(p => p[2] !== '').map((p, i) => {
    const o = on[p[0]]; const col = LC[p[0]];
    return (i ? '<div class="sep">_</div>' : '') + `<div class="cp"><div class="lv" style="background:${col}">${p[1]}</div><div class="v" style="${o ? `color:#fff;background:${col};border-color:#fff` : ''}">${o ? p[2] : '····'}</div><div class="nm">${o ? p[3] : ''}</div></div>`;
  }).join('');
}

function drawOverlay(seg, lt) {
  const ov = $('ov'), ph = seg.ph;
  const a = ss(lt / .5) * ss((seg.dur - lt) / .5);
  const show = n => ss((lt - n) / .4), tr = n => `opacity:${show(n).toFixed(3)};transform:translateY(${((1 - show(n)) * 24).toFixed(1)}px)`;
  let h = '';
  if (ph === 'title') h = `<h1>เราจัดหมวดหมู่ทรัพย์สินอย่างไร?</h1><h2>Big C Asset Blueprint · อธิบายทีละขั้น</h2><p>อ้างอิงโครงสร้าง BMMS Machine Database (EGD) · ใช้ได้ทั้ง Mini Big C และ Big Format</p>`;
  else if (ph === 'rule') {
    const tl = [['c', '🗄️', 'หมวดหลัก', 'Category', 'C03', 'ลิ้นชัก · เหมือน "จังหวัด"', .45], ['s', '📁', 'หมวดย่อย', 'Subcategory', 'S001', 'แฟ้ม · เหมือน "อำเภอ"', .58], ['t', '🗂️', 'ประเภท', 'Type', 'T003', 'การ์ด · เหมือน "ถนน"', .72], ['m', '🏷️', 'ตัวเครื่อง', 'Machine', 'M0001', 'QR · เหมือน "บ้านเลขที่"', .86]];
    h = `<h2>กฎเดียว 4 ระดับ · เหมือนที่อยู่บ้าน</h2><div class="tiles">` + tl.map(([k, ic, lv, en, cd, an, f], i) => (i ? `<div class="arrow" style="${tr(F(ph, f) - .1)}">→</div>` : '') + `<div class="tile" style="border-color:${LC[k]};${tr(F(ph, f))}"><div class="ic">${ic}</div><div class="lv">${lv}</div><div class="en">${en}</div><div class="cd" style="background:${LC[k]}">${cd}</div><div class="an">${an}</div></div>`).join('') + `</div>`;
  } else if (ph === 'check') {
    h = `<h2>ตรวจยอด: ทรัพย์สินรวม = BOQ + PO</h2><p>ตัวอย่างจริง · Mini Big C สุขสวัสดิ์ 30 · 48 ทรัพย์สิน</p><div class="eq">
      <div class="eqb" style="${tr(F(ph, .2))}"><div class="l">ทรัพย์สินรวม (ทุก QR)</div><div class="n">4,284,790.52</div></div><div class="eqo" style="${tr(F(ph, .3))}">=</div>
      <div class="eqb" style="${tr(F(ph, .4))}"><div class="l">BOQ ผู้รับเหมา</div><div class="n">3,025,903.65</div></div><div class="eqo" style="${tr(F(ph, .5))}">+</div>
      <div class="eqb" style="${tr(F(ph, .6))}"><div class="l">PO ของที่บิ๊กซีจัดหา</div><div class="n">1,258,886.87</div></div></div>
      <div class="zero" style="${tr(F(ph, .82))}">ส่วนต่าง 0.00 ✓</div>`;
  } else if (ph === 'mini_big') {
    h = `<h2>ใช้กฎเดียวกัน ต่างกันที่ "ใครใส่รหัส"</h2><div class="cards2">
      <div class="c2" style="${tr(F(ph, 0))}"><div class="hd" style="background:#0b7a5e">Mini Big C · แบบฟอร์มตายตัว</div><div class="bd">รหัสใส่ไว้แล้วทุกบรรทัด ผู้รับเหมากรอกแค่จำนวนและราคา
        <table><tr><td class="k">C03_S001_T003</td><td>แอร์แยกส่วน 36,000 BTU</td><td>2 ชุด</td></tr><tr><td class="k">C01_S001_T010</td><td>ตู้แช่ 3 ประตู</td><td>3 ตู้</td></tr><tr><td class="k">C02_S002_T001</td><td>ตู้ MDB</td><td>1 ตู้</td></tr></table></div></div>
      <div class="c2" style="${tr(F(ph, .5))}"><div class="hd" style="background:#1d4ed8">Big Format · เลือกรหัสทุกบรรทัด</div><div class="bd">BOQ แยกตามอาคาร / โซน ผู้รับเหมาเลือกรหัส และระบุว่าท่อ-สายไฟจ่ายให้เครื่องใด
        <table><tr><td>Chiller · อาคาร A (ตัวอย่าง)</td><td><span class="dd">C03_S003_T001 ▾</span></td></tr><tr><td>ท่อน้ำเย็น · โซน Sale</td><td><span class="dd">Network → Chiller ▾</span></td></tr><tr><td>บันไดเลื่อน · ชั้น 1–2</td><td><span class="dd">C09_S001_T002 ▾</span></td></tr></table></div></div></div>`;
  } else if (ph === 'outro') {
    h = `<h2>จำง่ายๆ</h2><div class="chain">` + [['c', '🗄️ ลิ้นชัก'], ['s', '📁 แฟ้ม'], ['t', '🗂️ การ์ด'], ['m', '🏷️ เครื่อง']].map(([k, n], i) => (i ? '<span style="opacity:.7">→</span>' : '') + `<span class="k" style="background:${LC[k]};${tr(F(ph, .05) + i * .35)}">${n}</span>`).join('') +
      `</div><div class="fullcode" style="${tr(F(ph, .45))}"><span style="color:#475569">SKS30</span>_<span style="color:${LC.c}">C03</span>_<span style="color:${LC.s}">S001</span>_<span style="color:${LC.t}">T003</span>_<span style="color:${LC.m}">M0001</span></div>
      <p style="margin-top:18px;${tr(F(ph, .6))}">รหัสเดียว: BOQ → Oracle FA → BMMS QR</p>`;
  }
  if (!h) { ov.style.display = 'none'; return; }
  ov.style.display = 'block'; ov.style.opacity = a; ov.innerHTML = `<div class="ovbg"></div><div class="ovw">${h}</div>`;
}
window.READY = true;
</script>
