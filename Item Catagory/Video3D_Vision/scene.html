<!DOCTYPE html>
<html lang="th"><head><meta charset="UTF-8"><title>BOQ App vision 3D</title>
<style>
  html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#0b1220;font-family:'Leelawadee UI','Segoe UI',Tahoma,sans-serif}

  .co small{display:block;font-size:14px;font-weight:600;opacity:.92}
  .co.bad{background:#b91c1c;border-color:#b91c1c}.co.good{background:#15803d;border-color:#15803d}.co.info{background:#1e293b;border-color:#1e293b}
  .co.up{background:#1d4ed8;border-color:#1d4ed8}.co.fad{background:#b45309;border-color:#b45309}.co.mtn{background:#0f766e;border-color:#0f766e}

  #chap{position:absolute;left:24px;top:20px;padding:8px 18px;border-radius:12px;background:rgba(15,23,42,.85);color:#fff;font-size:22px;font-weight:700;border-left:6px solid #64748b}
  #brand{position:absolute;right:24px;top:22px;color:#fff;font-size:15px;font-weight:700;background:rgba(15,23,42,.7);padding:6px 12px;border-radius:999px}

  #ov{position:absolute;inset:0;display:none}
  .ovbg{position:absolute;inset:0;background:radial-gradient(1000px 620px at 50% 42%,rgba(12,40,80,.84),rgba(4,12,28,.94))}
  .ovw{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;padding:0 50px 96px}

  .ph{width:250px;padding:14px 14px 16px;background:rgba(255,255,255,.09);border-top:6px solid;text-align:left;position:relative}
  .ph .n{font-size:14px;font-weight:700;opacity:.8}.ph b{display:block;font-size:21px;margin:4px 0 6px}.ph span{font-size:15.5px;opacity:.9;line-height:1.5}

  #pip .im{position:relative;width:730px;height:456px;background:#fff;border:3px solid #0f172a;border-top:0;border-radius:0 0 12px 12px;overflow:hidden}
  #pip .im img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;object-position:top}

  .gi{background:#fff;border-radius:10px;overflow:hidden;color:#0f172a;text-align:left}
  .gi img{display:block;width:262px;height:164px;object-fit:cover;object-position:top}

</style></head>
<body>
<canvas id="c" width="1280" height="720"></canvas>
<div id="callouts"></div>
<div id="chap"></div><div id="brand">MTN Suite · BOQ App</div>
<div id="pip"></div><div id="ov"></div><div id="sub"></div>
<div id="fade"></div>
<script src="timeline.js"></script>
<script type="module">
import * as THREE from './three.module.js';
const W = 1280, H = 720, $ = id => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ss = x => { x = clamp(x); return x * x * (3 - 2 * x); };
const eio = x => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const back = x => { x = clamp(x); const c = 1.9; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const lerp = (a, b, k) => a + (b - a) * k;
const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
const COL = { up: '#1d4ed8', mid: '#0891b2', fad: '#b45309', mtn: '#0f766e', gad: '#6d28d9', loop: '#0369a1' };

const TL = window.TL, SEG = {}; TL.forEach(e => SEG[e.ph] = e);
let T = 0;
const S0 = ph => SEG[ph].start, SE = ph => SEG[ph].start + SEG[ph].dur;
const F = (ph, fr) => (SEG[ph].audio - SEG[ph].start) + fr * SEG[ph].nd;
const A = (ph, off, dur = 1) => ss((T - S0(ph) - off) / dur);
const IN = ph => T >= S0(ph) && T < SE(ph);
const L = ph => T - S0(ph);
const AFTER = ph => T >= S0(ph);

// ── renderer ──
const renderer = new THREE.WebGLRenderer({ canvas: $('c'), antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(window.devicePixelRatio || 1); renderer.setSize(W, H, false);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xbcd6ee); scene.fog = new THREE.Fog(0xbcd6ee, 70, 170);
const camera = new THREE.PerspectiveCamera(50, W / H, 0.1, 500);
scene.add(new THREE.HemisphereLight(0xffffff, 0x5b7a4a, 1.1));
const sun = new THREE.DirectionalLight(0xfff6e6, 1.8); sun.position.set(20, 45, 30); sun.target.position.set(0, 0, 10);
sun.castShadow = true; sun.shadow.mapSize.set(4096, 4096);
Object.assign(sun.shadow.camera, { left: -60, right: 60, top: 60, bottom: -60, near: 1, far: 150 }); sun.shadow.bias = -0.0005;
scene.add(sun); scene.add(sun.target);

const MC = {};
function mat(c, o) { const k = c + JSON.stringify(o || {}); return MC[k] || (MC[k] = new THREE.MeshStandardMaterial(Object.assign({ color: c, roughness: .75, metalness: .05 }, o || {}))); }
function grp(parent, x = 0, y = 0, z = 0, ry = 0) { const g = new THREE.Group(); g.position.set(x, y, z); g.rotation.y = ry; parent.add(g); return g; }
function box(g, w, h, d, c, x = 0, y = 0, z = 0, o) { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), o && o.isMaterial ? o : mat(c, o)); m.position.set(x, y + h / 2, z); m.castShadow = m.receiveShadow = true; g.add(m); return m; }
function cyl(g, r, h, c, x = 0, y = 0, z = 0, o, seg = 24, r2) { const m = new THREE.Mesh(new THREE.CylinderGeometry(r2 == null ? r : r2, r, h, seg), o && o.isMaterial ? o : mat(c, o)); m.position.set(x, y + h / 2, z); m.castShadow = m.receiveShadow = true; g.add(m); return m; }
function tex(w, h, draw) { const cv = document.createElement('canvas'); cv.width = w; cv.height = h; draw(cv.getContext('2d'), w, h); const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t; }
const FONT = '"Leelawadee UI","Segoe UI",Tahoma,sans-serif';
function plate(g, w, h, bg, lines, x, y, z, o = {}) {
  const px = 512, ph = Math.round(px * h / w);
  const t = tex(px, ph, (c, cw, ch) => {
    c.fillStyle = bg; c.fillRect(0, 0, cw, ch);
    const tot = lines.reduce((s, l) => s + l[1], 0) * ch * 1.15; let yy = ch / 2 - tot / 2;
    lines.forEach(([s, f, col, b]) => { const fs = f * ch; c.font = (b === false ? '' : 'bold ') + Math.round(fs) + 'px ' + FONT; c.fillStyle = col; c.textAlign = 'center'; c.textBaseline = 'middle'; yy += fs * 1.15 / 2; c.fillText(s, cw / 2, yy, cw * .94); yy += fs * 1.15 / 2; });
  });
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshStandardMaterial({ map: t, roughness: .6, emissive: 0xffffff, emissiveMap: t, emissiveIntensity: o.glow == null ? .3 : o.glow, side: o.two ? THREE.DoubleSide : THREE.FrontSide }));
  m.position.set(x, y, z); if (o.ry) m.rotation.y = o.ry; g.add(m); return m;
}
// app-screen mock: header + rows [[left, right, chipColor]]
function screenTex(title, color, rows, foot) {
  return tex(640, 400, (c) => {
    c.fillStyle = '#f8fafc'; c.fillRect(0, 0, 640, 400);
    c.fillStyle = color; c.fillRect(0, 0, 640, 64);
    c.fillStyle = '#fff'; c.font = 'bold 22px ' + FONT; c.textBaseline = 'middle'; c.fillText('MTN Suite', 20, 22);
    c.font = 'bold 30px ' + FONT; c.fillText(title, 20, 48, 600);
    rows.forEach(([l, r, chip], i) => {
      const y = 86 + i * 50; c.fillStyle = i % 2 ? '#eef2f7' : '#ffffff'; c.fillRect(14, y, 612, 44);
      c.fillStyle = '#0f172a'; c.font = '600 22px ' + FONT; c.fillText(l, 26, y + 22, 400);
      if (r) { c.font = 'bold 20px ' + FONT; const w = c.measureText(r).width + 24; c.fillStyle = chip || '#e2e8f0'; c.fillRect(612 - w, y + 7, w, 30); c.fillStyle = chip ? '#fff' : '#0f172a'; c.fillText(r, 624 - w, y + 22); }
    });
    if (foot) { c.fillStyle = color; c.fillRect(14, 346, 612, 42); c.fillStyle = '#fff'; c.font = 'bold 22px ' + FONT; c.textAlign = 'center'; c.fillText(foot, 320, 367); }
  });
}
function person(g, x, z, shirt, ry = 0, helmet) {
  const p = grp(g, x, 0, z, ry);
  cyl(p, .17, .8, 0x1f2937, -.09, 0, 0, null, 10); cyl(p, .17, .8, 0x1f2937, .09, 0, 0, null, 10);
  const b = new THREE.Mesh(new THREE.CapsuleGeometry(.28, .55, 4, 10), mat(shirt)); b.position.y = 1.15; b.castShadow = true; p.add(b);
  const h = new THREE.Mesh(new THREE.SphereGeometry(.22, 16, 12), mat(0xe0b48c)); h.position.y = 1.72; h.castShadow = true; p.add(h);
  if (helmet) { const hm = new THREE.Mesh(new THREE.SphereGeometry(.24, 16, 8, 0, Math.PI * 2, 0, Math.PI / 2), mat(helmet)); hm.position.y = 1.76; p.add(hm); }
  return p;
}

// ───────────── terrain: valley with a hill (upstream) ─────────────
const HC = new THREE.Vector2(-34, 0), HR = 19, HH = 7.5;
const ground = (x, z) => { const r = Math.hypot(x - HC.x, z - HC.y); return r < HR ? HH * Math.pow(1 - (r * r) / (HR * HR), 2) : 0; };
{ const g = new THREE.PlaneGeometry(200, 170, 200, 170); g.rotateX(-Math.PI / 2); g.translate(0, 0, 25);
  const p = g.attributes.position; for (let i = 0; i < p.count; i++) p.setY(i, ground(p.getX(i), p.getZ(i)));
  g.computeVertexNormals(); const m = new THREE.Mesh(g, mat(0x8cc46e, { roughness: .95 })); m.receiveShadow = true; scene.add(m); }

// river: main stream + two downstream branches
const P3 = pts => pts.map(([x, z]) => new THREE.Vector3(x, ground(x, z), z));
const MAIN = new THREE.CatmullRomCurve3(P3([[-34, 0], [-29, 3], [-21, 5], [-13, 3.5], [-5, -.5], [3, -2], [10, -1]]));
const BRA = new THREE.CatmullRomCurve3(P3([[10, -1], [16, -5], [22, -10], [27.5, -13]]));
const BRB = new THREE.CatmullRomCurve3(P3([[10, -1], [16, 3], [22, 8], [27.5, 11]]));
const waterTex = tex(64, 256, (c, w, h) => { const g = c.createLinearGradient(0, 0, w, 0); g.addColorStop(0, '#2b6cb0'); g.addColorStop(.5, '#3b8fe0'); g.addColorStop(1, '#2b6cb0'); c.fillStyle = g; c.fillRect(0, 0, w, h); c.strokeStyle = 'rgba(255,255,255,.55)'; c.lineWidth = 2; for (let i = 0; i < 14; i++) { const x = 6 + hash(i) * 52, y = hash(i + 9) * h; c.beginPath(); c.moveTo(x, y); c.lineTo(x + 2, y + 18 + hash(i + 3) * 20); c.stroke(); } });
waterTex.wrapS = waterTex.wrapT = THREE.RepeatWrapping;
const waterMat = new THREE.MeshStandardMaterial({ map: waterTex, roughness: .25, metalness: .1, emissive: 0x1e5aa8, emissiveIntensity: .25, side: THREE.DoubleSide });
function ribbon(curve, w, n) {
  const pos = [], uv = [], idx = [], len = curve.getLength();
  for (let i = 0; i <= n; i++) { const u = i / n, p = curve.getPointAt(u), t = curve.getTangentAt(u), s = new THREE.Vector3(-t.z, 0, t.x).normalize();
    [-1, 1].forEach(k => { const q = p.clone().addScaledVector(s, k * w / 2); pos.push(q.x, ground(q.x, q.z) + .1, q.z); uv.push((k + 1) / 2, u * len / 4); }); }
  for (let i = 0; i < n; i++) { const a = i * 2; idx.push(a, a + 1, a + 2, a + 1, a + 3, a + 2); }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2)); g.setIndex(idx); g.computeVertexNormals();
  const m = new THREE.Mesh(g, waterMat); m.receiveShadow = true; scene.add(m); m.userData.n = n; return m;
}
const RMAIN = ribbon(MAIN, 2.6, 220), RA = ribbon(BRA, 2.2, 90), RB = ribbon(BRB, 2.2, 90);
const lakeMat = new THREE.MeshStandardMaterial({ color: 0x2f7fd0, roughness: .2, metalness: .1, emissive: 0x1e5aa8, emissiveIntensity: .25 });
const LAKE_A = new THREE.Mesh(new THREE.CircleGeometry(5.2, 40), lakeMat); LAKE_A.rotation.x = -Math.PI / 2; LAKE_A.position.set(31, .1, -14.5); scene.add(LAKE_A);
const LAKE_B = new THREE.Mesh(new THREE.CircleGeometry(5.2, 40), lakeMat); LAKE_B.rotation.x = -Math.PI / 2; LAKE_B.position.set(31, .1, 12.5); scene.add(LAKE_B);
const spring = cyl(scene, 1.4, .5, 0x94a3b8, -34, ground(-34, 0) - .2, 0);
// trees
{ const samples = [MAIN, BRA, BRB].flatMap(c => c.getSpacedPoints(80));
  for (let i = 0; i < 140; i++) {
    const x = -70 + hash(i) * 140, z = -40 + hash(i + 50) * 75;
    if (samples.some(p => Math.hypot(p.x - x, p.z - z) < 3.4)) continue;
    if (Math.hypot(x - 31, z + 14.5) < 7 || Math.hypot(x - 31, z - 12.5) < 7) continue;
    if ([[-35, -6], [-21, -2], [-7, -8], [5, 6], [38, -21], [38, 19], [6, -17]].some(([a, b]) => Math.hypot(x - a, z - b) < 5)) continue;
    const y = ground(x, z), s = .7 + hash(i + 7) * .7;
    cyl(scene, .12 * s, .9 * s, 0x7c5a3a, x, y, z, null, 6);
    const c = new THREE.Mesh(new THREE.ConeGeometry(.75 * s, 1.9 * s, 8), mat([0x2f7d3a, 0x3a8f45, 0x276b31][i % 3])); c.position.set(x, y + .9 * s + .9 * s, z); c.castShadow = true; scene.add(c);
  } }

// ───────────── stations ─────────────
const ST = {};
function station(id, x, z, color, label, scr, faceTo, build) {
  const y = ground(x, z), g = grp(scene, x, y, z);
  cyl(g, 2.6, 3.2, 0xe5e7eb, 0, -2.9, 0);
  const ringMat = new THREE.MeshStandardMaterial({ color: new THREE.Color(color), emissive: new THREE.Color(color), emissiveIntensity: .2 });
  const ring = new THREE.Mesh(new THREE.TorusGeometry(2.6, .09, 8, 48), ringMat); ring.rotation.x = Math.PI / 2; ring.position.y = .32; g.add(ring);
  if (build) build(g);
  const sc = grp(g, 0, 3.6, 0); sc.lookAt(faceTo[0], y + 3.6, faceTo[1]);
  box(sc, 3.9, 2.5, .12, 0x0f172a, 0, -1.25, -.07);
  const sm = new THREE.MeshStandardMaterial({ map: scr, emissive: 0xffffff, emissiveMap: scr, emissiveIntensity: .55, roughness: .5 });
  const s = new THREE.Mesh(new THREE.PlaneGeometry(3.7, 2.3), sm); s.position.z = .0; sc.add(s);
  cyl(g, .08, 2.4, 0x334155, 0, .3, 0);
  plate(sc, 3.9, .55, color, [[label, .55, '#fff']], 0, -1.62, .02, { glow: .55 });
  ST[id] = { g, ring: ringMat, x, y, z, sc, sm };
  return g;
}
station('s1', -35, -6, COL.up, 'ตั้งโครงการ · PPT / BM', screenTex('ตั้งโครงการใหม่', COL.up, [['สาขา', '(รหัสสาขา)'], ['Format', 'Mini Big C'], ['ประเภทโครงการ', 'Renovate'], ['แบบฟอร์ม BOQ', 'มาตรฐาน + รหัส', '#16a34a']], 'สร้างโครงการ'), [-24, 14],
  g => { box(g, 2.4, 1.6, 1.8, 0xf1f5f9, 1.1, .3, -1); box(g, 2.6, .25, 2.0, 0x1d4ed8, 1.1, 1.9, -1); person(g, -1.2, .6, 0x1d4ed8); });
station('s2', -21, -2, COL.up, 'BOQ App · ผู้รับเหมา', screenTex('กรอก BOQ', COL.up, [['C03_S001_T003 แอร์แยกส่วน', '✓', '#16a34a'], ['C01_S001_T010 ตู้แช่ 3 ประตู', '✓', '#16a34a'], ['C02_S002_T001 ตู้ MDB', '✓', '#16a34a'], ['เทียบราคาอ้างอิง', 'ในเกณฑ์', '#0891b2']], 'รหัสครบ 100% · ส่ง BOQ'), [-19, 8],
  g => { box(g, 1.6, .75, .9, 0x92400e, .9, .3, .2); box(g, .9, .04, .6, 0x111827, .9, 1.05, .2); const lp = box(g, .9, .55, .03, 0x111827, .9, 1.07, -.08); lp.rotation.x = -.2; person(g, -.2, .9, 0xf59e0b, .4, 0xfacc15); });
station('s3', -7, -8, COL.mid, 'GCP · เปรียบเทียบ + PO', screenTex('เปรียบเทียบราคา', COL.mid, [['ผู้รับเหมา A', 'ต่ำสุด', '#16a34a'], ['ผู้รับเหมา B', '+4%'], ['บรรทัดนอกแบบฟอร์ม', '0'], ['อนุมัติตาม DOA', '✓', '#16a34a']], 'อนุมัติ → PR / PO'), [-4, 5],
  g => { box(g, 2.4, 1.5, 1.8, 0xf1f5f9, -1.1, .3, -1); box(g, 2.6, .25, 2.0, 0x0891b2, -1.1, 1.8, -1); person(g, 1.2, .5, 0x0891b2); });
station('s4', 5, 6, COL.mid, 'ส่งมอบ · สแกน QR', screenTex('ทะเบียนเครื่อง', COL.mid, [['M0001 แอร์ 36,000 BTU', 'QR ✓', '#16a34a'], ['ยี่ห้อ / รุ่น', 'กรอกแล้ว'], ['Serial', 'กรอกแล้ว'], ['รูปถ่าย', '✓', '#16a34a']], 'ยืนยันส่งมอบ'), [7, 15],
  g => { box(g, 2.6, 1.7, 2.0, 0xfafaf9, -1.0, .3, -1.1); box(g, 2.8, .3, 2.2, 0x16a34a, -1.0, 2.0, -1.1);
         const cdu = grp(g, 1.0, .3, -.4); box(cdu, .9, .7, .4, 0xe5e7eb); const fn = cyl(cdu, .22, .02, 0x334155); fn.rotation.x = Math.PI / 2; fn.position.set(-.15, .37, .21);
         ST.qr = plate(cdu, .22, .28, '#ffffff', [['▦', .7, '#111']], .27, .4, .205, { glow: .6 }); ST.tech = person(g, 1.6, 1.0, 0x0f766e, -2.6, 0xf97316); });

  $('fade').style.opacity = Math.max(1 - ss(t / .8), ss((t - (total - 1.2)) / 1.0));
  renderer.render(scene, camera);
};

{ const loader = new THREE.TextureLoader();
