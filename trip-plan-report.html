    <script>
        // Auth Logic
        const AUTH_KEY = 'app_auth_token';
        const AUTH_USER = 'app_user_data';
        let CURRENT_USER = null;

        (function checkAuth() {
            const user = localStorage.getItem(AUTH_USER);
            if (user) {
                try {
                    CURRENT_USER = JSON.parse(user);
                    updateUserUI(CURRENT_USER);
                    document.getElementById('auth-overlay').classList.add('hidden');
                    document.getElementById('user-controls').classList.remove('hidden');
                } catch (e) {
                    logout();
                }
            } else {
                document.getElementById('auth-overlay').classList.remove('hidden');
                document.getElementById('user-controls').classList.add('hidden');
            }
        })();

        function updateUserUI(user) {
            const display = document.getElementById('user-email-display');
            if (display) display.textContent = user.name || user.email;
        }

        function handleLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            const spinner = document.getElementById('loginSpinner');
            const errorMsg = document.getElementById('loginError');
            const email = document.getElementById('loginEmail').value;
            const pwd = document.getElementById('loginPassword').value;

            btn.disabled = true; spinner.classList.remove('hidden'); errorMsg.classList.add('hidden');

            google.script.run.withSuccessHandler(function (res) {
                btn.disabled = false; spinner.classList.add('hidden');
                if (res.success) {
                    localStorage.setItem(AUTH_USER, JSON.stringify(res.user));
                    localStorage.setItem(AUTH_KEY, 'valid');
                    CURRENT_USER = res.user;
                    updateUserUI(CURRENT_USER);
                    document.getElementById('auth-overlay').classList.add('hidden');
                    document.getElementById('user-controls').classList.remove('hidden');
                } else {
                    errorMsg.textContent = res.error; errorMsg.classList.remove('hidden');
                }
            }).withFailureHandler(function (err) {
                btn.disabled = false; spinner.classList.add('hidden');
                errorMsg.textContent = "System Error: " + err; errorMsg.classList.remove('hidden');
            }).loginUser(email, pwd);
        }

        function logout() {
            localStorage.removeItem(AUTH_USER);
            localStorage.removeItem(AUTH_KEY);
            location.reload();
        }
    </script>

    <script>
        let allOrders = [];
        let isAdmin = false; // Global Admin Flag
        let currentPage = 1;
        const recordsPerPage = 20;
        let loadTimeout;

        window.onload = function () {
            console.log("Window loaded. Starting init...");

            // Set a 15 second timeout
            loadTimeout = setTimeout(function () {
                console.error("Request timed out after 15 seconds");
                document.getElementById('loading').innerHTML = `
                    <div class="text-center py-10">
                        <div class="text-red-500 text-lg font-bold mb-2">⚠️ Loading Timeout</div>
                        <p class="text-gray-500 mb-4">The server is taking too long to respond.</p>
                        <button onclick="location.reload()" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">
                            Retry
                        </button>
                    </div>
                `;
            }, 15000);

            // Helper to get manual login email
            const getCurrentUserEmail = () => {
                const u = localStorage.getItem(AUTH_USER);
                if (u) {
                    try { return JSON.parse(u).email; } catch (e) { return null; }
                }
                return CURRENT_USER ? CURRENT_USER.email : null;
            };

            console.log("Calling google.script.run.getAllTripPlansReport with manual user:", getCurrentUserEmail());
            google.script.run
                .withSuccessHandler(function (data) {
                    clearTimeout(loadTimeout);
                    // console.log("Server responded successfully");
                    initReport(data);
                })
                .withFailureHandler(function (err) {
                    clearTimeout(loadTimeout);
                    console.error("Server execution failed:", err);
                    document.getElementById('loading').innerHTML = `
                        <div class="text-center py-10">
                            <div class="text-red-500 text-lg font-bold mb-2">❌ Error</div>
                            <p class="text-gray-500 mb-4">${err}</p>
                            <button onclick="location.reload()" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">
                                Retry
                            </button>
                        </div>
                    `;
                })
                .getAllTripPlansReport(getCurrentUserEmail());
        };

        function initReport(jsonString) {
            console.log("initReport called with raw:", jsonString);
            document.getElementById('loading').classList.add('hidden');

            let data;
            try {
                // Check if already an object
                if (typeof jsonString === 'object') {
                    data = jsonString;
                } else {
                    data = JSON.parse(jsonString);
                }
            } catch (e) {
                console.error("JSON Parse Error:", e, "Raw data:", jsonString);
                alert("Data Error: Backend returned invalid JSON.");
                return;
            }

            if (data.error) {
                console.error("Backend reported error:", data.error);
                alert("Error loading data: " + data.error);
            }

            allOrders = data.orders || [];
            isAdmin = data.isAdmin || false; // Capture Admin Status
            console.log("Loaded orders:", allOrders.length, "IsAdmin:", isAdmin);

            if (allOrders.length === 0) {
                console.log("Debug Info:", data.debug || "No debug info");
                console.log("Full data:", data);
            }

            console.log("Populating options and rendering table...");
            populateFilterOptions();
            renderTable();
            console.log("Init complete.");

            // Debug Logging for Admin Issue (Silent)
            if (data.adminLogs && data.adminLogs.length > 0) {
                console.log("=== SERVER ADMIN CHECK LOGS ===");
                console.log(data.adminLogs.join('\n'));
                console.log("===============================");
            }
        }

        function populateFilterOptions() {
            const getUnique = (prop) => [...new Set(allOrders.map(o => o[prop]).filter(Boolean))].sort();
            const fillSelect = (id, items) => {
                const el = document.getElementById(id);
                // Keep first 'All' option
                const first = el.firstElementChild;
                el.innerHTML = '';
                el.appendChild(first);
                items.forEach(i => {
                    const opt = document.createElement('option');
                    opt.value = i; opt.textContent = i;
                    el.appendChild(opt);
                });
            };
            fillSelect('filterName', getUnique('empName'));
            fillSelect('filterDept', getUnique('department'));
        }

        function nextPage() {
            currentPage++;
            renderTable();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function previousPage() {
            if (currentPage > 1) {
                currentPage--;
                renderTable();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function renderTable() {
            const statusFilter = document.getElementById('filterStatus').value;
            const nameFilter = document.getElementById('filterName').value.toLowerCase();
            const deptFilter = document.getElementById('filterDept').value.toLowerCase();
            const tbody = document.getElementById('reportBody');
            tbody.innerHTML = '';

            const filtered = allOrders.filter(o => {
                if (statusFilter !== 'All') {
                    if (statusFilter === 'Pending' && o.status !== 'Pending') return false;
                    if (statusFilter === 'Waiting Approval' && o.status !== 'Waiting Approval') return false;
                    if (statusFilter === 'Closed' && (o.status !== 'Closed' && o.status !== 'Approved')) return false;
                    if (statusFilter === 'Rejected' && o.status !== 'Rejected') return false;
                }
                if (nameFilter && String(o.empName).toLowerCase() !== nameFilter) return false;
                if (deptFilter && String(o.department).toLowerCase() !== deptFilter) return false;
                return true;
            });

            const totalRecords = filtered.length;
            const totalPages = Math.ceil(totalRecords / recordsPerPage);
            const startIndex = (currentPage - 1) * recordsPerPage;
            const endIndex = startIndex + recordsPerPage;
            const displayedRecords = filtered.slice(startIndex, endIndex);

            // Update record count
            document.getElementById('recordCount').textContent = `Showing ${startIndex + 1}-${Math.min(endIndex, totalRecords)} of ${totalRecords} Records`;

            // Show/Hide pagination controls
            const paginationControls = document.getElementById('paginationControls');
            if (totalRecords > recordsPerPage) {
                paginationControls.classList.remove('hidden');
                document.getElementById('pageInfo').textContent = `Page ${currentPage} of ${totalPages}`;
                document.getElementById('prevBtn').disabled = currentPage === 1;
                document.getElementById('nextBtn').disabled = currentPage >= totalPages;
            } else {
                paginationControls.classList.add('hidden');
            }

            if (displayedRecords.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="p-8 text-center text-gray-400 italic">No records found.</td></tr>';
                return;
            }

            displayedRecords.forEach(order => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-gray-50 transition-colors";

                // Log Permission Debug Info for this row
                if (order.debugPermission) {
                    console.log(`[Order ${order.id}] Permission:`, order.debugPermission);
                }

                // Action Buttons Logic
                let actionHtml = '<div class="flex justify-center gap-2 flex-wrap">';

                // 1. Admin Actions (Always visible if Admin)
                if (isAdmin) {
                    actionHtml += `
                        <button onclick='openEditModal(${JSON.stringify(order).replace(/'/g, "&#39;")})' class="bg-blue-100 hover:bg-blue-200 text-blue-700 p-2 rounded-full shadow-sm transition transform hover:scale-105" title="Edit">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
                        </button>
                        <button onclick="handleDelete('${order.id}')" class="bg-gray-200 hover:bg-gray-300 text-gray-700 p-2 rounded-full shadow-sm transition transform hover:scale-105" title="Delete">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                        </button>
                    `;
                }

                // 2. Approval Actions (If Pending/Waiting)
                if ((order.status === 'Waiting Approval' || order.status === 'Pending') && order.canApprove) {
                    actionHtml += `
                    <button onclick="handleApprove('${order.id}')" class="bg-green-100 hover:bg-green-200 text-green-700 p-2 rounded-full shadow-sm transition transform hover:scale-105" title="Approve">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                    </button>
                    <button onclick="handleReject('${order.id}')" class="bg-red-100 hover:bg-red-200 text-red-700 p-2 rounded-full shadow-sm transition transform hover:scale-105" title="Reject">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                    </button>`;
                }

                // 3. Status Badge (If no actions shown)
                if (actionHtml === '<div class="flex justify-center gap-2 flex-wrap">') {
                    if (order.status === 'Closed' || order.status === 'Approved') {
                        actionHtml += `<span class="bg-green-100 text-green-800 text-xs px-2 py-1 rounded-full font-medium">Approved</span>`;
                    } else if (order.status === 'Rejected') {
                        actionHtml += `<span class="bg-red-100 text-red-800 text-xs px-2 py-1 rounded-full font-medium">Rejected</span>`;
                    } else {
                        actionHtml += `<span class="text-gray-300">-</span>`;
                    }
                }

                actionHtml += '</div>';

                // Attachments
                let attHtml = '';
                if (order.evidence) attHtml += `<a href="${order.evidence}" target="_blank" class="text-xs text-blue-600 underline block">Evidence</a>`;
                if (order.creationAttachment) attHtml += `<a href="${order.creationAttachment}" target="_blank" class="text-xs text-blue-600 underline block">Ref Doc</a>`;

                // Status Class
                let statusClass = "bg-gray-100 text-gray-600";
                if (order.status === 'Pending') statusClass = "status-Pending";
                if (order.status === 'Waiting Approval') statusClass = "status-Waiting";
                if (order.status === 'Closed' || order.status === 'Approved') statusClass = "status-Closed";
                if (order.status === 'Rejected') statusClass = "status-Rejected";

                tr.innerHTML = `
                    <td class="p-4 border-r border-gray-100 bg-gray-50/50 valign-middle">
                        ${actionHtml}
                    </td>
                    <td class="p-4 text-center">
                        <span class="inline-block px-2 py-0.5 text-[10px] font-bold uppercase tracking-wide rounded-full ${statusClass.replace('bg-', 'bg-opacity-20 ')} border border-opacity-20">
                           ${order.status}
                        </span>
                        <div class="text-[10px] text-gray-400 mt-1">${order.id}</div>
                    </td>
                    <td class="p-4">
                        <div class="font-bold text-gray-900 text-sm">${order.empName || order.empId}</div>
                        <div class="text-xs text-gray-500">${order.department || ''}</div>
                    </td>
                    <td class="p-4">
                        <div class="text-sm font-semibold text-gray-800">${order.storeName || order.station || '-'}</div>
                        <div class="text-xs text-gray-500">${order.province || ''}</div>
                        ${order.address && order.address !== '-' && order.address !== '' ? `<div class="text-xs text-gray-400 mt-1 line-clamp-2" title="${order.address}">${order.address}</div>` : ''}
                        ${order.gps ? `<a href="https://maps.google.com/?q=${order.gps}" target="_blank" class="text-xs text-blue-500 hover:underline mt-1 inline-block">📍 Map</a>` : ''}
                    </td>
                    <td class="p-4 max-w-xs">
                        <div class="font-bold text-gray-800 text-sm mb-1">${order.project}</div>
                        <div class="text-xs text-gray-600 line-clamp-2 mb-1" title="${order.details}">${order.details}</div>
                        <div class="flex gap-2 mt-1">
                            ${attHtml}
                            <button onclick='viewDetails(${JSON.stringify(order).replace(/'/g, "&#39;")})' class="text-xs text-blue-500 hover:underline">View All</button>
                        </div>
                    </td>
                    <td class="p-4 text-xs whitespace-nowrap">
                        <div>Start: ${order.startDate || '-'}</div>
                        <div>End: ${order.deadline || '-'}</div>
                        ${order.approvedBy ? `<div class="mt-1 text-green-600">Appr: ${order.approvedBy}</div>` : ''}
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function handleApprove(id) {
            const rating = prompt("Rating (1-5):", "5");
            if (!rating) return;

            if (!confirm('Are you sure you want to approve this trip plan?')) return;

            const approverName = CURRENT_USER?.name || CURRENT_USER?.email || 'Manager';

            // disable button
            const btn = event.currentTarget;
            btn.innerHTML = '...'; btn.disabled = true;

            google.script.run.withSuccessHandler(res => {
                if (res.success) {
                    alert('Trip plan approved successfully!');
                    renderTableReLoad();
                }
                else { alert(res.error); btn.disabled = false; btn.innerHTML = 'Retry'; }
            }).withFailureHandler(err => {
                alert("Error: " + err);
                btn.disabled = false; btn.innerHTML = 'Retry';
            }).approveTripPlan(id, approverName, rating, getCurrentUserEmail());
        }

        function handleReject(id) {
            const reason = prompt('Please enter rejection reason (optional):');
            if (reason === null) return; // Cancelled

            const rejectorName = CURRENT_USER?.name || CURRENT_USER?.email || 'Manager';

            const btn = event.currentTarget;
            btn.innerHTML = '...'; btn.disabled = true;

            google.script.run.withSuccessHandler(res => {
                if (res.success) {
                    alert('Trip plan rejected successfully!');
                    renderTableReLoad();
                }
                else { alert(res.error); btn.disabled = false; btn.innerHTML = 'Retry'; }
            }).withFailureHandler(err => {
                alert("Error: " + err);
                btn.disabled = false; btn.innerHTML = 'Retry';
            }).rejectTripPlan(id, rejectorName, reason || '', getCurrentUserEmail());
        }

        function renderTableReLoad() {
            // Reload all data to refresh status
            google.script.run
                .withSuccessHandler(initReport)
                .getAllTripPlansReport(getCurrentUserEmail());
        }

        function viewDetails(order) {
            document.getElementById('detailsModal').classList.remove('hidden');
            const content = document.getElementById('modalContent');
            const mapLink = order.gps ? `<a href="https://maps.google.com/?q=${order.gps}" target="_blank" class="text-blue-600 hover:underline">📍 Open in Google Maps</a>` : '-';

            // Initial content
            content.innerHTML = `
                <div class="grid grid-cols-2 gap-4 text-sm">
                    <div><strong>Project:</strong> ${order.project}</div>
                    <div><strong>Status:</strong> ${order.status}</div>
                    <div class="col-span-2 bg-gray-50 p-3 rounded">
                        <strong>Details:</strong><br>${order.details}
                    </div>
                    <div class="col-span-2"><strong>Destination:</strong> ${order.storeName || order.station || '-'}</div>
                    <div class="col-span-2"><strong>Province:</strong> ${order.province || '-'}</div>
                    <div class="col-span-2"><strong>Address:</strong> ${order.address || '-'}</div>
                    <div class="col-span-2"><strong>Location:</strong> ${mapLink}</div>
                    <div><strong>Vendor:</strong> ${order.vendor || '-'}</div>
                    <div><strong>Contract:</strong> ${order.contract || '-'}</div>
                    <div><strong>Start:</strong> ${order.startDate}</div>
                    <div><strong>End:</strong> ${order.deadline}</div>
                    <div class="col-span-2 text-green-700 bg-green-50 p-2 rounded ${order.approvedBy ? '' : 'hidden'}">
                        <strong>Approved By:</strong> ${order.approvedBy} (${order.approvedByRole || 'Manager'})
                    </div>
                    <div><strong>Doc No:</strong> ${order.workDocNumber || '-'}</div>
                    <div><strong>Est Dist:</strong> ${order.estimatedDistance || '-'}</div>
                </div>
            `;
        }
        function closeDetailsModal() { document.getElementById('detailsModal').classList.add('hidden'); }

        // --- Admin Actions ---

        function handleDelete(id) {
            if (!confirm('Are you sure you want to PERMANENTLY DELETE this trip plan? This action cannot be undone.')) return;

            // UI Feedback
            const btn = event.currentTarget;
            btn.innerHTML = '...'; btn.disabled = true;

            google.script.run.withSuccessHandler(res => {
                if (res.success) {
                    alert('Deleted successfully.');
                    renderTableReLoad();
                } else {
                    alert('Error: ' + res.error);
                    btn.disabled = false; btn.innerHTML = 'Error';
                }
            }).withFailureHandler(err => {
                alert('System Error: ' + err);
                btn.disabled = false;
            }).deleteTripPlan(id, getCurrentUserEmail());
        }

        function openEditModal(order) {
            document.getElementById('editOrderId').value = order.id;
            document.getElementById('editProject').value = order.project || '';
            document.getElementById('editDetails').value = order.details || '';
            document.getElementById('editStatus').value = order.status || 'Pending';
            document.getElementById('editPriority').value = order.priority || 'Medium';

            // Date formatting for input type=date (YYYY-MM-DD)
            const fmtDate = (dStr) => {
                if (!dStr || dStr === '-') return '';
                // Assuming dStr is DD/MM/YYYY or similar textual? 
                // Wait, order.startDate might be "2026-02-06 00:00" or already formatted string.
                // If it's standard ISO or readable, we try to parse.
                // Best effort:
                const d = new Date(dStr);
                if (isNaN(d)) return '';
                return d.toISOString().split('T')[0];
            };

            document.getElementById('editStart').value = fmtDate(order.startDate);
            document.getElementById('editEnd').value = fmtDate(order.deadline);

            // Set station field
            const stationValue = order.storeName || order.station || '';
            document.getElementById('editStation').value = stationValue;

            document.getElementById('editModal').classList.remove('hidden');
        }

        function closeEditModal() {
            document.getElementById('editModal').classList.add('hidden');
        }

        function submitEdit() {
            const id = document.getElementById('editOrderId').value;
            const form = {
                id: id,
                project: document.getElementById('editProject').value,
                details: document.getElementById('editDetails').value,
                priority: document.getElementById('editPriority').value,
                status: document.getElementById('editStatus').value,
                startDate: document.getElementById('editStart').value,
                deadline: document.getElementById('editEnd').value,
                station: document.getElementById('editStation').value
            };

            if (!confirm('Save changes?')) return;

            google.script.run.withSuccessHandler(res => {
                if (res.success) {
                    alert('Updated successfully');
                    closeEditModal();
                    renderTableReLoad();
                } else {
                    alert('Update Failed: ' + res.error);
                }
            }).withFailureHandler(err => {
                alert('System Error: ' + err);
            }).updateTripPlan(form, getCurrentUserEmail());
        }

        // Store Search Functionality - Load stores using getStationList (same as Trip Plan)
        function loadStores() {
            google.script.run
                .withSuccessHandler(function (stations) {
                    populateStationSelect(stations);
                    console.log('Loaded ' + stations.length + ' stations');
                })
                .withFailureHandler(function (err) {
                    console.error('Failed to load stations:', err);
                })
                .getStationList();
        }

        function populateStationSelect(stations) {
            const datalist = document.getElementById('station-list');
            if (!datalist) return;
            
            datalist.innerHTML = '';
            
            if (!stations || stations.length === 0) {
                return;
            }
            
            stations.forEach(station => {
                const option = document.createElement('option');
                option.value = station;
                datalist.appendChild(option);
            });
        }

        // Load stores when page loads
        window.addEventListener('DOMContentLoaded', function () {
            loadStores();
        });

        // Helper to get current user email
        function getCurrentUserEmail() {
            const u = localStorage.getItem(AUTH_USER);
            if (u) {
                try { return JSON.parse(u).email; } catch (e) { return null; }
            }
            return CURRENT_USER ? CURRENT_USER.email : null;
        }
    </script>
</body>

</html>
