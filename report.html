    <script>
        // Auth Logic
        const AUTH_KEY = 'app_auth_token';
        const AUTH_USER = 'app_user_data';
        let CURRENT_USER = null;

        // Check Login on Load
        (function checkAuth() {
            const user = localStorage.getItem(AUTH_USER);
            if (user) {
                try {
                    CURRENT_USER = JSON.parse(user);
                    updateUserUI(CURRENT_USER);
                    document.getElementById('auth-overlay').classList.add('hidden');
                    document.getElementById('user-controls').classList.remove('hidden');
                } catch (e) {
                    console.error("Auth Error", e);
                    logout();
                }
            } else {
                // Show login
                document.getElementById('auth-overlay').classList.remove('hidden');
                document.getElementById('user-controls').classList.add('hidden');
            }
        })();

        function updateUserUI(user) {
            const display = document.getElementById('user-email-display');
            if (display) display.textContent = user.name || user.email;
        }

        function handleLogin(e) {
            e.preventDefault();

            const btn = document.getElementById('loginBtn');
            const spinner = document.getElementById('loginSpinner');
            const errorMsg = document.getElementById('loginError');
            const email = document.getElementById('loginEmail').value;
            const pwd = document.getElementById('loginPassword').value;

            // UI Loading
            btn.disabled = true;
            spinner.classList.remove('hidden');
            errorMsg.classList.add('hidden');

            google.script.run
                .withSuccessHandler(function (res) {
                    btn.disabled = false;
                    spinner.classList.add('hidden');

                    if (res.success) {
                        // Save Session
                        localStorage.setItem(AUTH_USER, JSON.stringify(res.user));
                        localStorage.setItem(AUTH_KEY, 'valid');

                        CURRENT_USER = res.user;
                        updateUserUI(CURRENT_USER);

                        // Hide Overlay, Show Controls
                        document.getElementById('auth-overlay').classList.add('hidden');
                        document.getElementById('user-controls').classList.remove('hidden');
                    } else {
                        errorMsg.textContent = res.error;
                        errorMsg.classList.remove('hidden');
                    }
                })
                .withFailureHandler(function (err) {
                    btn.disabled = false;
                    spinner.classList.add('hidden');
                    errorMsg.textContent = "System Error: " + err;
                    errorMsg.classList.remove('hidden');
                })
                .loginUser(email, pwd);
        }

        function logout() {
            localStorage.removeItem(AUTH_USER);
            localStorage.removeItem(AUTH_KEY);
            location.reload();
        }

        // Allow Global Access (if needed by other scripts)
        window.logout = logout;
        window.checkAuth = checkAuth; // in case we need to re-verify

        // Change Password Logic
        function toggleChangePwd(show) {
            const modal = document.getElementById('change-pwd-modal');
            if (show) {
                modal.classList.remove('hidden');
                document.getElementById('changePwdError').classList.add('hidden');
                document.getElementById('oldPwd').value = '';
                document.getElementById('newPwd').value = '';
                document.getElementById('confirmPwd').value = '';
            } else {
                modal.classList.add('hidden');
            }
        }

        function handleChangePwd(e) {
            e.preventDefault();

            const oldPwd = document.getElementById('oldPwd').value;
            const newPwd = document.getElementById('newPwd').value;
            const confirmPwd = document.getElementById('confirmPwd').value;
            const errorMsg = document.getElementById('changePwdError');
            const btn = document.getElementById('changePwdBtn');

            if (newPwd !== confirmPwd) {
                errorMsg.textContent = "New passwords do not match.";
                errorMsg.classList.remove('hidden');
                return;
            }

            if (!CURRENT_USER || !CURRENT_USER.email) {
                errorMsg.textContent = "Session invalid. Please logout and login again.";
                errorMsg.classList.remove('hidden');
                return;
            }

            btn.disabled = true;
            btn.textContent = "Updating...";

            google.script.run
                .withSuccessHandler(function (res) {
                    btn.disabled = false;
                    btn.textContent = "Update Password";

                    if (res.success) {
                        alert("Password changed successfully. Please login again.");
                        logout();
                    } else {
                        errorMsg.textContent = res.error;
                        errorMsg.classList.remove('hidden');
                    }
                })
                .withFailureHandler(function (err) {
                    btn.disabled = false;
                    btn.textContent = "Update Password";
                    errorMsg.textContent = "Error: " + err;
                    errorMsg.classList.remove('hidden');
                })
                .changePassword(CURRENT_USER.email, oldPwd, newPwd);
        }
    </script>

                            class="w-full border p-2 rounded text-sm bg-gray-50"></textarea>
                    </div>

                    <div class="flex gap-3 pt-4 border-t">
                        <button onclick="saveChanges()" id="saveBtn"
                            class="flex-1 bg-green-600 text-white py-2 rounded-lg font-bold hover:bg-green-700 transition">Save
                            Changes</button>
                        <button onclick="toggleEdit()"
                            class="flex-1 bg-gray-300 text-gray-700 py-2 rounded-lg font-bold hover:bg-gray-400 transition">Cancel</button>
                    </div>
                </div>

            </div> <!-- End Content -->
        </div> <!-- End Scrollable Wrapper -->
    </div>
    </div>

    <!-- Lightbox Modal -->
    <div id="lightboxModal"
        class="hidden fixed inset-0 bg-black bg-opacity-90 z-[60] flex items-center justify-center p-4"
        onclick="closeLightbox()">
        <img id="lightboxImage" class="max-w-full max-h-full rounded-lg shadow-2xl" src="" referrerpolicy="no-referrer">
        <button class="absolute top-4 right-4 text-white text-opacity-70 hover:text-opacity-100 focus:outline-none">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
            </svg>
        </button>
    </div>

    <script>
        let isChartLibLoaded = false;
        let chartResponse = null; // Changed from chartData
        let currentUserEmail = "";

        // Add CSS style for highlighting
        const style = document.createElement('style');
        style.innerHTML = `
            .current-user-node {
                border: 3px solid #16a34a !important; /* Green border */
                box-shadow: 0 0 15px rgba(22, 163, 74, 0.5) !important;
                background-color: #f0fdf4 !important;
            }
        `;
        document.head.appendChild(style);

        google.charts.load('current', { packages: ["orgchart"] });
        google.charts.setOnLoadCallback(function () {
            isChartLibLoaded = true;
            tryDraw();
        });

        // Fetch data immediately
        google.script.run
            .withSuccessHandler(function (response) {
                // Handle both old array format (just in case) and new object format
                if (Array.isArray(response)) {
                    chartResponse = { nodes: response, currentUserEmail: "" };
                } else {
                    chartResponse = response;
                }
                tryDraw();
            })
            .withFailureHandler(function (err) {
                console.error("Server Error: " + err);
                document.getElementById('loading').innerHTML = '<p class="text-red-500">Error: ' + err + '</p>';
            })
            .getOrgChartData();

        function tryDraw() {
            if (isChartLibLoaded && chartResponse) {
                const nodes = chartResponse.nodes;
                currentUserEmail = chartResponse.currentUserEmail;

                if (!nodes || nodes.length === 0) {
                    document.getElementById('loading').innerHTML = '<p>No data found.</p>';
                    return;
                }
                try {
                    drawChart(nodes);
                } catch (e) {
                    console.error("Error drawing chart: " + e);
                }
            }
        }

        function drawChart(nodes) {
            globalNodes = nodes;
            var data = new google.visualization.DataTable();
            data.addColumn('string', 'Name');
            data.addColumn('string', 'Manager');
            data.addColumn('string', 'ToolTip');

            // Map nodes to Google Charts format
            var chartRows = nodes.map(function (node) {
                var nodeClass = "";

                // Check if this node belongs to current user
                if (currentUserEmail && node.details && node.details.email &&
                    node.details.email.toLowerCase().trim() === currentUserEmail.toLowerCase().trim()) {
                    nodeClass = "current-user-node";
                }

                var cardHtml = `
                    <div class="${nodeClass}" style="
                        padding: 10px;
                        display: flex;
                        flex-direction: column;
                        align-items: center;
                        min-width: 140px;
                        cursor: pointer;
                        border-radius: 8px;
                        transition: all 0.2s;
                    " onclick="showDetails('${node.id}')">
                        <img src="${node.image}" style="width: 50px; height: 50px; border-radius: 50%; object-fit: cover; margin-bottom: 8px; border: 2px solid #e5e7eb;">
                        <div style="font-weight: bold; color: #1f2937; margin-bottom: 2px;">${node.name}</div>
                        <div style="color: #6b7280; font-size: 0.8em;">${node.position || ''}</div>
                    </div>
                `;
                return [{ v: node.id, f: cardHtml }, node.parent, node.position];
            });

            data.addRows(chartRows);

            var chart = new google.visualization.OrgChart(document.getElementById('chart_div'));

            // Clear loading
            document.getElementById('loading').classList.add('hidden');

            chart.draw(data, {
                allowHtml: true,
                allowCollapse: true,
                nodeClass: 'bg-white shadow-sm border border-gray-200 rounded-lg',
                selectedNodeClass: 'bg-blue-50 border-blue-500'
            });
        }

        function closeModal() {
            document.getElementById('detailsModal').classList.add('hidden');
            // Reset to view mode
            document.getElementById('editMode').classList.add('hidden');
            document.getElementById('viewMode').classList.remove('hidden');
            document.getElementById('editBtn').classList.remove('hidden');
        }

        function expandImage() {
            // Only expand if edit mode is hidden (View Mode)
            if (document.getElementById('editMode').classList.contains('hidden')) {
                var imgSrc = document.getElementById('modalImage').src;
                document.getElementById('lightboxImage').src = imgSrc;
                document.getElementById('lightboxModal').classList.remove('hidden');
            }
        }

        function closeLightbox() {
            document.getElementById('lightboxModal').classList.add('hidden');
        }

        function toggleEdit() {
            const viewMode = document.getElementById('viewMode');
            const editMode = document.getElementById('editMode');
            const editBtn = document.getElementById('editBtn');

            if (editMode.classList.contains('hidden')) {
                // Switch to Edit
                viewMode.classList.add('hidden');
                editMode.classList.remove('hidden');
                editBtn.classList.add('hidden');

                // Reset Save Button (Safety)
                const saveBtn = document.getElementById('saveBtn');
                saveBtn.textContent = 'Save Changes';
                saveBtn.disabled = false;

                // Populate Inputs
                if (currentNodeData && currentNodeData.details) {
                    const d = currentNodeData.details;
                    document.getElementById('editEmpId').value = d.empId || '';
                    document.getElementById('editName').value = d.name || currentNodeData.name;
                    document.getElementById('editOriginalName').value = d.name || currentNodeData.name; // Keep original for lookup
                    document.getElementById('editNickname').value = d.nickname || '';
                    document.getElementById('editManager').value = d.manager || '';
                    document.getElementById('editPosition').value = d.position || currentNodeData.position;
                    document.getElementById('editDepartment').value = d.department || ''; // Populate Department
                    document.getElementById('editPhone').value = d.phone || '';
                    document.getElementById('editEmail').value = d.email || '';
                    document.getElementById('editZone').value = d.zone || '';
                    document.getElementById('editInfo').value = d.info || '';
                    document.getElementById('editIntro').value = d.intro || '';
                    // Photo Reset
                    document.getElementById('editPhotoInput').value = '';
                    editPhotoData = null;
                    document.getElementById('editPhotoOverlay').classList.remove('hidden'); // Show overlay
                }

            } else {
                // Switch to View
                viewMode.classList.remove('hidden');
                editMode.classList.add('hidden');
                editBtn.classList.remove('hidden');

                // Hide photo overlay
                document.getElementById('editPhotoOverlay').classList.add('hidden');

                // Reset Image to Original if canceled (not saved)
                if (currentNodeData) {
                    document.getElementById('modalImage').src = currentNodeData.image || 'https://cdn-icons-png.flaticon.com/512/847/847969.png';
                }
            }
        }

        let editPhotoData = null; // Declare variable

        function handleEditPhoto(input) {
            if (input.files && input.files[0]) {
                var reader = new FileReader();

                reader.onload = function (e) {
                    // Update Preview
                    document.getElementById('modalImage').src = e.target.result;

                    // Store Data
                    editPhotoData = {
                        data: e.target.result.split(',')[1],
                        mimeType: input.files[0].type,
                        name: input.files[0].name
                    };
                }

                reader.readAsDataURL(input.files[0]);
            }
        }

        function saveChanges() {
            const btn = document.getElementById('saveBtn');
            const originalText = btn.textContent;
            btn.textContent = "Saving...";
            btn.disabled = true;

            const formData = {
                empId: document.getElementById('editEmpId').value,
                originalName: document.getElementById('editOriginalName').value,
                name: document.getElementById('editName').value,
                nickname: document.getElementById('editNickname').value,
                manager: document.getElementById('editManager').value,
                position: document.getElementById('editPosition').value,
                department: document.getElementById('editDepartment').value, // Save Department
                phone: document.getElementById('editPhone').value,
                email: document.getElementById('editEmail').value,
                zone: document.getElementById('editZone').value,
                info: document.getElementById('editInfo').value,
                intro: document.getElementById('editIntro').value,
                // Photo Data
                photoData: editPhotoData ? editPhotoData.data : null,
                photoMimeType: editPhotoData ? editPhotoData.mimeType : null,
                photoName: editPhotoData ? editPhotoData.name : null
            };

            google.script.run
                .withSuccessHandler(function (res) {
                    if (res.success) {
                        alert('Saved successfully!');

                        // Reset Button State
                        btn.textContent = "Save Changes";
                        btn.disabled = false;

                        // Instead of reload, close modal and refresh chart data
                        closeModal();
                        document.getElementById('loading').classList.remove('hidden');
                        document.getElementById('chart_div').innerHTML = ''; // Clear old chart

                        // Re-fetch data
                        google.script.run
                            .withSuccessHandler(function (response) {
                                if (Array.isArray(response)) {
                                    chartResponse = { nodes: response, currentUserEmail: "" };
                                } else {
                                    chartResponse = response;
                                }
                                tryDraw();
                            })
                            .withFailureHandler(function (err) {
                                console.error("Server Error: " + err);
                                document.getElementById('loading').innerHTML = '<p class="text-red-500">Error: ' + err + '</p>';
                            })
                            .getOrgChartData();

                    } else {
                        alert('Error: ' + res.error);
                        btn.textContent = originalText;
                        btn.disabled = false;
                    }
                })
                .withFailureHandler(function (err) {
                    alert('Error: ' + err);
                    btn.textContent = originalText;
                    btn.disabled = false;
                })
                .updateEmployee(formData);
        }

        // Close modal on click outside
        window.onclick = function (event) {
            if (event.target == document.getElementById('detailsModal')) {
                closeModal();
            }
        }

        function drawChart(nodes) {
            document.getElementById('loading').classList.add('hidden');
            globalNodes = nodes; // Save for lookup

            var data = new google.visualization.DataTable();
            data.addColumn('string', 'Name');
            data.addColumn('string', 'Manager');
            data.addColumn('string', 'ToolTip');

            // Transform nodes for Google Charts
            var rows = nodes.map(function (node) {
                var htmlContent = `
          <div class="node-card" id="node-${node.id}">
            ${node.image ? `<img src="${node.image}" class="node-image" alt="Use valid URL" referrerpolicy="no-referrer"/>` : ''}
            <div class="node-name">${node.name}</div>
            <div class="node-role">${node.position}</div>
          </div>
        `;
                return [{ v: node.id, f: htmlContent }, node.parent, node.position];
            });

            data.addRows(rows);

            // Create the chart.
            var chart = new google.visualization.OrgChart(document.getElementById('chart_div'));

            // Add selection listener
            google.visualization.events.addListener(chart, 'select', function () {
                var selection = chart.getSelection();
                if (selection.length > 0) {
                    var row = selection[0].row;
                    var nodeId = data.getValue(row, 0);
                    showDetails(nodeId);
                    chart.setSelection([]);
                }
            });

            // Draw the chart
            chart.draw(data, { 'allowHtml': true, 'size': 'medium' });
        }

        function showDetails(id) {
            const node = globalNodes.find(n => n.id === id);
            if (!node) return;

            currentNodeData = node; // Store for Edit Mode

            // Populate View Mode
            document.getElementById('modalImage').src = node.image || 'https://cdn-icons-png.flaticon.com/512/847/847969.png';
            document.getElementById('modalName').textContent = node.name;
            document.getElementById('modalPosition').textContent = node.position;
            document.getElementById('modalDepartment').textContent = node.details ? (node.details.department || '') : '';
            document.getElementById('modalZone').textContent = node.details ? (node.details.zone || 'No Zone Info') : '-';
            document.getElementById('modalManager').textContent = node.details ? (node.details.manager || 'No Manager Info') : '-';

            const phone = node.details ? node.details.phone : '-';
            const email = node.details ? node.details.email : '-';
            const intro = node.details ? node.details.intro : '';

            document.getElementById('modalPhone').textContent = phone;
            document.getElementById('modalPhone').href = 'tel:' + phone;

            document.getElementById('modalEmail').textContent = email;
            document.getElementById('modalEmail').href = 'mailto:' + email;

            document.getElementById('modalIntro').textContent = intro || "No introduction provided.";

            // --- Populate Direct Reports ---
            const directReports = globalNodes.filter(n => n.parent && n.parent.trim() === id);
            const reportsSection = document.getElementById('modalReportsSection');
            const reportsList = document.getElementById('modalReportsList');
            const reportsCount = document.getElementById('modalReportsCount');

            if (directReports.length > 0) {
                reportsSection.classList.remove('hidden');
                reportsCount.textContent = directReports.length;
                reportsList.innerHTML = directReports.map(emp => `
                    <div onclick="showDetails('${emp.id}')" 
                         class="flex items-center p-2 bg-gray-50 rounded-lg cursor-pointer hover:bg-green-50 hover:border-green-200 border border-transparent transition-colors">
                        <img src="${emp.image || 'https://cdn-icons-png.flaticon.com/512/847/847969.png'}" 
                             class="w-8 h-8 rounded-full object-cover border border-gray-200" referrerpolicy="no-referrer">
                        <div class="ml-3">
                            <p class="text-sm font-semibold text-gray-800 leading-tight">${emp.name}</p>
                            <p class="text-xs text-gray-500">${emp.position || 'Staff'}</p>
                        </div>
                    </div>
                `).join('');
            } else {
                reportsSection.classList.add('hidden');
                reportsList.innerHTML = '';
            }

            // Show Modal
            document.getElementById('detailsModal').classList.remove('hidden');
        }
    </script>
</body>

</html>
