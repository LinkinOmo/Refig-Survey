<div id="auth-overlay" class="fixed inset-0 bg-gray-900 bg-opacity-90 z-[100] flex items-center justify-center p-4">
    <div class="bg-white rounded-xl shadow-2xl max-w-md w-full p-8">
        <div class="text-center mb-6">
            <h2 class="text-2xl font-bold text-gray-800">Welcome Back</h2>
            <p class="text-gray-500">Please sign in to continue</p>
        </div>

        <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
                <input type="email" id="loginEmail"
                    class="w-full border border-gray-300 p-2.5 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition"
                    required placeholder="your.name@example.com">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                <input type="password" id="loginPassword"
                    class="w-full border border-gray-300 p-2.5 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition"
                    required placeholder="••••••••">
            </div>

            <div id="loginError" class="hidden text-red-500 text-sm text-center bg-red-50 p-2 rounded">
                Invalid credentials
            </div>

            <button type="submit" id="loginBtn"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-lg transition-colors flex items-center justify-center gap-2">
                <span>Sign In</span>
                <svg id="loginSpinner" class="hidden w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor"
                        d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                    </path>
                </svg>
            </button>
        </form>
    </div>
</div>

<!-- Change Password Modal -->
<div id="change-pwd-modal"
    class="hidden fixed inset-0 bg-gray-900 bg-opacity-50 z-[110] flex items-center justify-center p-4">
    <div class="bg-white rounded-xl shadow-2xl max-w-sm w-full p-6">
        <h3 class="text-xl font-bold text-gray-800 mb-4">Change Password</h3>
        <form onsubmit="handleChangePwd(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-medium text-gray-500 uppercase">Old Password</label>
                <input type="password" id="oldPwd"
                    class="w-full border border-gray-300 p-2 rounded focus:ring-2 focus:ring-blue-500 outline-none"
                    required>
            </div>
            <div>
                <label class="block text-xs font-medium text-gray-500 uppercase">New Password</label>
                <input type="password" id="newPwd"
                    class="w-full border border-gray-300 p-2 rounded focus:ring-2 focus:ring-blue-500 outline-none"
                    required>
            </div>
            <div>
                <label class="block text-xs font-medium text-gray-500 uppercase">Confirm New</label>
                <input type="password" id="confirmPwd"
                    class="w-full border border-gray-300 p-2 rounded focus:ring-2 focus:ring-blue-500 outline-none"
                    required>
            </div>

            <div id="changePwdError" class="hidden text-red-500 text-sm"></div>

            <div class="flex justify-end gap-2 pt-2">
                <button type="button" onclick="toggleChangePwd(false)"
                    class="text-gray-500 hover:text-gray-700 px-4 py-2 text-sm">Cancel</button>
                <button type="submit" id="changePwdBtn"
                    class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 text-sm font-medium">Update
                    Password</button>
            </div>
        </form>
    </div>
</div>

<!-- User Controls -->
<div id="user-controls"
    class="hidden fixed top-4 right-4 z-[90] flex items-center gap-3 bg-white/90 backdrop-blur-sm p-2 px-4 rounded-full shadow-lg border border-gray-100 transition-all hover:shadow-xl">
    <div class="flex flex-col items-end">
        <span id="user-email-display" class="text-xs font-bold text-gray-700"></span>
        <span class="text-[10px] text-gray-500">Logged in</span>
    </div>
    <div class="h-6 w-px bg-gray-200 mx-1"></div>
    <button onclick="toggleChangePwd(true)" class="text-gray-600 hover:text-blue-600 p-1" title="Change Password">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11.536 11 13 12.464l-4 4L7.5 15l-4 4m6-1a2 2 0 002-2" />
        </svg>
    </button>
    <button onclick="logout()" class="text-gray-600 hover:text-red-600 p-1" title="Logout">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
        </svg>
    </button>
</div>


<script>
    // Auth Logic
    const AUTH_KEY = 'app_auth_token';
    const AUTH_USER = 'app_user_data';
    let CURRENT_USER = null;

    // Check Login on Load
    (function checkAuth() {
        const user = localStorage.getItem(AUTH_USER);
        if (user) {
            try {
                CURRENT_USER = JSON.parse(user);
                updateUserUI(CURRENT_USER);
                document.getElementById('auth-overlay').classList.add('hidden');
                document.getElementById('user-controls').classList.remove('hidden');
            } catch (e) {
                console.error("Auth Error", e);
                logout();
            }
        } else {
            // Show login
            document.getElementById('auth-overlay').classList.remove('hidden');
            document.getElementById('user-controls').classList.add('hidden');
        }
    })();

    function updateUserUI(user) {
        const display = document.getElementById('user-email-display');
        if (display) display.textContent = user.name || user.email;
    }

    function handleLogin(e) {
        e.preventDefault();

        const btn = document.getElementById('loginBtn');
        const spinner = document.getElementById('loginSpinner');
        const errorMsg = document.getElementById('loginError');
        const email = document.getElementById('loginEmail').value;
        const pwd = document.getElementById('loginPassword').value;

        // UI Loading
        btn.disabled = true;
        spinner.classList.remove('hidden');
        errorMsg.classList.add('hidden');

        google.script.run
            .withSuccessHandler(function (res) {
                btn.disabled = false;
                spinner.classList.add('hidden');

                if (res.success) {
                    // Save Session
                    localStorage.setItem(AUTH_USER, JSON.stringify(res.user));
                    localStorage.setItem(AUTH_KEY, 'valid');

                    CURRENT_USER = res.user;
                    updateUserUI(CURRENT_USER);

                    // Hide Overlay, Show Controls
                    document.getElementById('auth-overlay').classList.add('hidden');
                    document.getElementById('user-controls').classList.remove('hidden');
                } else {
                    errorMsg.textContent = res.error;
                    errorMsg.classList.remove('hidden');
                }
            })
            .withFailureHandler(function (err) {
                btn.disabled = false;
                spinner.classList.add('hidden');
                errorMsg.textContent = "System Error: " + err;
                errorMsg.classList.remove('hidden');
            })
            .loginUser(email, pwd);
    }

    function logout() {
        localStorage.removeItem(AUTH_USER);
        localStorage.removeItem(AUTH_KEY);
        location.reload();
    }

    // Allow Global Access (if needed by other scripts)
    window.logout = logout;
    window.checkAuth = checkAuth; // in case we need to re-verify

    // Change Password Logic
    function toggleChangePwd(show) {
        const modal = document.getElementById('change-pwd-modal');
        if (show) {
            modal.classList.remove('hidden');
            document.getElementById('changePwdError').classList.add('hidden');
            document.getElementById('oldPwd').value = '';
            document.getElementById('newPwd').value = '';
            document.getElementById('confirmPwd').value = '';
        } else {
            modal.classList.add('hidden');
        }
    }

    function handleChangePwd(e) {
        e.preventDefault();

        const oldPwd = document.getElementById('oldPwd').value;
        const newPwd = document.getElementById('newPwd').value;
        const confirmPwd = document.getElementById('confirmPwd').value;
        const errorMsg = document.getElementById('changePwdError');
        const btn = document.getElementById('changePwdBtn');

        if (newPwd !== confirmPwd) {
            errorMsg.textContent = "New passwords do not match.";
            errorMsg.classList.remove('hidden');
            return;
        }

        if (!CURRENT_USER || !CURRENT_USER.email) {
            errorMsg.textContent = "Session invalid. Please logout and login again.";
            errorMsg.classList.remove('hidden');
            return;
        }

        btn.disabled = true;
        btn.textContent = "Updating...";

        google.script.run
            .withSuccessHandler(function (res) {
                btn.disabled = false;
                btn.textContent = "Update Password";

                if (res.success) {
                    alert("Password changed successfully. Please login again.");
                    logout();
                } else {
                    errorMsg.textContent = res.error;
                    errorMsg.classList.remove('hidden');
                }
            })
            .withFailureHandler(function (err) {
                btn.disabled = false;
                btn.textContent = "Update Password";
                errorMsg.textContent = "Error: " + err;
                errorMsg.classList.remove('hidden');
            })
            .changePassword(CURRENT_USER.email, oldPwd, newPwd);
    }
</script>
