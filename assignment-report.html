<!DOCTYPE html>
<html>

<head>
    <base target="_top">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Prompt', sans-serif;
        }
    </style>
</head>

<body class="bg-gray-100 min-h-screen">
    <!-- Header -->
    <div class="bg-orange-600 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold">Assignment Report</h1>
            <a href="<?= ScriptApp.getService().getUrl() ?>" target="_top"
                class="bg-white/20 hover:bg-white/30 px-4 py-2 rounded transition">
                Back to App
            </a>
        </div>
    </div>

    <!-- Main Content -->
    <div class="max-w-7xl mx-auto px-6 py-8">
        <!-- Loading State -->
        <div id="loading" class="text-center py-20">
            <div class="animate-spin rounded-full h-16 w-16 border-b-4 border-orange-600 mx-auto mb-4"></div>
            <p class="text-gray-600 text-lg">Loading assignments...</p>
        </div>

        <!-- Content -->
        <div id="content" class="hidden">
            <!-- Stats -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                <div class="bg-white rounded-lg shadow p-6 text-center">
                    <div class="text-4xl font-bold text-gray-800" id="statTotal">0</div>
                    <div class="text-gray-500 mt-2">Total Assignments</div>
                </div>
                <div class="bg-white rounded-lg shadow p-6 text-center">
                    <div class="text-4xl font-bold text-blue-600" id="statActive">0</div>
                    <div class="text-gray-500 mt-2">Active</div>
                </div>
                <div class="bg-white rounded-lg shadow p-6 text-center">
                    <div class="text-4xl font-bold text-green-600" id="statCompleted">0</div>
                    <div class="text-gray-500 mt-2">Completed</div>
                </div>
            </div>

            <!-- Assignment Cards -->
            <div id="assignmentList" class="space-y-4"></div>

            <!-- Empty State -->
            <div id="emptyState" class="hidden bg-white rounded-lg shadow p-12 text-center">
                <svg class="w-16 h-16 text-gray-300 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z">
                    </path>
                </svg>
                <p class="text-gray-500 text-lg">No assignments found</p>
            </div>
        </div>
    </div>

    <script>
        let allData = [];

        window.onload = function () {
            google.script.run
                .withSuccessHandler(init)
                .withFailureHandler(handleError)
                .getAssignmentReport();
        };

        function init(data) {
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('content').classList.remove('hidden');

            if (data.error) {
                handleError(data.error);
                return;
            }

            allData = data.assignments || [];
            updateStats();
            renderAssignments();
        }

        function handleError(error) {
            document.getElementById('loading').innerHTML = `
                <div class="bg-red-50 border border-red-200 rounded-lg p-6 max-w-md mx-auto">
                    <p class="text-red-600 font-medium">Error loading assignments</p>
                    <p class="text-red-500 text-sm mt-2">${error}</p>
                </div>
            `;
        }

        function updateStats() {
            document.getElementById('statTotal').textContent = allData.length;
            document.getElementById('statActive').textContent = allData.filter(a => a.status === 'Active').length;
            document.getElementById('statCompleted').textContent = allData.filter(a => a.status === 'Completed').length;
        }

        function renderAssignments() {
            const container = document.getElementById('assignmentList');
            container.innerHTML = '';

            if (allData.length === 0) {
                document.getElementById('emptyState').classList.remove('hidden');
                return;
            }

            allData.forEach(assignment => {
                const card = createAssignmentCard(assignment);
                container.appendChild(card);
            });
        }

        function createAssignmentCard(item) {
            const card = document.createElement('div');
            card.className = 'bg-white rounded-lg shadow hover:shadow-lg transition p-6';

            // Status badge styling
            let statusClass = 'bg-gray-100 text-gray-700';
            if (item.status === 'Active') statusClass = 'bg-blue-100 text-blue-700';
            if (item.status === 'Completed') statusClass = 'bg-green-100 text-green-700';
            if (item.status === 'Planned') statusClass = 'bg-yellow-100 text-yellow-700';

            card.innerHTML = `
                <div class="flex justify-between items-start mb-4">
                    <div class="flex-1">
                        <h3 class="text-xl font-bold text-gray-800 mb-1">${item.project || 'Untitled Project'}</h3>
                        <p class="text-gray-600">${item.empName || item.empId}</p>
                    </div>
                    <span class="px-3 py-1 rounded-full text-sm font-semibold ${statusClass}">
                        ${item.status || 'Unknown'}
                    </span>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-sm">
                    <div>
                        <span class="text-gray-500">Employee ID:</span>
                        <span class="text-gray-800 font-medium ml-2">${item.empId || '-'}</span>
                    </div>
                    <div>
                        <span class="text-gray-500">Role:</span>
                        <span class="text-gray-800 font-medium ml-2">${item.role || '-'}</span>
                    </div>
                    <div>
                        <span class="text-gray-500">Department:</span>
                        <span class="text-gray-800 font-medium ml-2">${item.department || '-'}</span>
                    </div>
                    <div>
                        <span class="text-gray-500">Duration:</span>
                        <span class="text-gray-800 font-medium ml-2">${formatDate(item.start)} - ${formatDate(item.end)}</span>
                    </div>
                </div>

                ${item.achievements ? `
                    <div class="mt-4 pt-4 border-t border-gray-200">
                        <p class="text-gray-500 text-xs font-medium mb-1">Notes</p>
                        <p class="text-gray-700 text-sm">${item.achievements}</p>
                    </div>
                ` : ''}
            `;

            return card;
        }

        function formatDate(dateStr) {
            if (!dateStr) return '-';
            try {
                const date = new Date(dateStr);
                return date.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
            } catch {
                return dateStr;
            }
        }
    </script>
</body>

</html>
