<!DOCTYPE html>
<html>

<head>
    <base target="_top">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Prompt', sans-serif;
            background: #f8fafc;
        }

        .spin {
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body class="text-slate-800">

    <div class="max-w-5xl mx-auto px-4 py-8">

        <!-- Header -->
        <div class="flex justify-between items-center mb-8">
            <div>
                <h1 class="text-2xl font-bold text-slate-900">Survey Configuration</h1>
                <p class="text-sm text-slate-500">Manage checklist items and weighting (estimated cost).</p>
            </div>
            <div class="flex gap-3">
                <button onclick="initializeDefaults()"
                    class="px-4 py-2 bg-slate-100 text-slate-600 rounded-lg text-sm font-medium hover:bg-slate-200 transition">
                    Reset to Defaults
                </button>
                <div class="h-6 w-px bg-slate-300 mx-1"></div>
                <a href="<?= ScriptApp.getService().getUrl() ?>?page=survey_report"
                    class="px-4 py-2 bg-white border border-slate-300 text-slate-700 rounded-lg text-sm font-medium hover:bg-slate-50 transition">
                    Back to Report
                </a>
                <button onclick="saveChanges()" id="saveBtn"
                    class="px-6 py-2 bg-blue-600 text-white rounded-lg text-sm font-bold hover:bg-blue-700 transition shadow-sm flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                    </svg>
                    Save Changes
                </button>
            </div>
        </div>

        <!-- Loading -->
        <div id="loading" class="text-center py-20 bg-white rounded-xl shadow-sm border border-slate-100">
            <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-blue-600 mx-auto mb-4"></div>
            <p class="text-slate-500 font-medium">Loading configuration...</p>
        </div>

        <!-- Content -->
        <div id="content" class="hidden space-y-8"></div>

        <!-- Toast -->
        <div id="toast"
            class="fixed bottom-4 right-4 bg-slate-800 text-white px-6 py-3 rounded-lg shadow-lg transform translate-y-20 opacity-0 transition duration-300 flex items-center gap-3">
            <span id="toastIcon"></span>
            <span id="toastMsg"></span>
        </div>

    </div>

    <script>
        let currentConfig = {};

        window.onload = function () {
            loadConfig();
        };

        function loadConfig() {
            google.script.run
                .withSuccessHandler(renderConfig)
                .withFailureHandler(err => {
                    alert("Error loading config: " + err);
                    document.getElementById('loading').innerHTML = `<p class="text-red-500">Error: ${err}</p>`;
                })
                .getSurveyConfig();
        }

        function renderConfig(config) {
            currentConfig = config;
            const container = document.getElementById('content');
            container.innerHTML = '';

            if (Object.keys(config).length === 0) {
                container.innerHTML = `<div class="p-12 text-center text-slate-400">No configuration found.</div>`;
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('content').classList.remove('hidden');
                return;
            }

            // Iterate Categories
            for (const category in config) {
                const items = config[category];

                const section = document.createElement('div');
                section.className = "bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden";

                let html = `
                    <div class="bg-slate-50 px-6 py-4 border-b border-slate-200 flex justify-between items-center">
                        <h2 class="font-bold text-slate-800">${category}</h2>
                        <span class="text-xs font-semibold bg-slate-200 text-slate-600 px-2 py-1 rounded-full">${items.length} items</span>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-slate-50/50 text-xs font-bold text-slate-500 uppercase border-b border-slate-100">
                                    <th class="px-6 py-3 w-16">#</th>
                                    <th class="px-6 py-3">Item ID</th>
                                    <th class="px-6 py-3">Label (EN)</th>
                                    <th class="px-6 py-3 w-48 text-right">Est. Cost / Weight (THB)</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-100 text-sm">
                `;

                items.forEach((item, index) => {
                    html += `
                        <tr class="hover:bg-slate-50 transition">
                            <td class="px-6 py-3 text-slate-400">${index + 1}</td>
                            <td class="px-6 py-3 font-mono text-xs text-slate-500">${item.itemId}</td>
                            <td class="px-6 py-3 font-medium text-slate-700">${item.labelEn}</td>
                            <td class="px-6 py-3 text-right">
                                <input type="number" 
                                    data-id="${item.itemId}"
                                    value="${item.weight || 0}"
                                    class="weight-input w-32 px-3 py-1.5 border border-slate-300 rounded text-right focus:ring-2 focus:ring-blue-500 outline-none transition"
                                    min="0">
                            </td>
                        </tr>
                    `;
                });

                html += `</tbody></table></div>`;
                section.innerHTML = html;
                container.appendChild(section);
            }

            document.getElementById('loading').classList.add('hidden');
            document.getElementById('content').classList.remove('hidden');
        }

        function saveChanges() {
            const btn = document.getElementById('saveBtn');
            const originalText = btn.innerHTML;
            btn.innerHTML = `<svg class="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> Saving...`;
            btn.disabled = true;

            const inputs = document.querySelectorAll('.weight-input');
            const updates = {};

            inputs.forEach(input => {
                const id = input.getAttribute('data-id');
                const val = parseFloat(input.value) || 0;
                updates[id] = val;
            });

            google.script.run
                .withSuccessHandler(res => {
                    btn.innerHTML = originalText;
                    btn.disabled = false;
                    if (res.success) {
                        showToast("Configuration saved successfully!", "success");
                    } else {
                        showToast("Error: " + res.error, "error");
                    }
                })
                .withFailureHandler(err => {
                    btn.innerHTML = originalText;
                    btn.disabled = false;
                    showToast("System Error: " + err, "error");
                })
                .saveSurveyWeights(updates);
        }

        function initializeDefaults() {
            if (!confirm("This will overwrite all current weights with default 'Mini-Mart' values. Continue?")) return;

            const btn = document.getElementById('saveBtn'); // Use main loader visual to lock
            btn.disabled = true;

            google.script.run
                .withSuccessHandler(res => {
                    btn.disabled = false;
                    alert(res);
                    loadConfig(); // Reload
                })
                .withFailureHandler(err => {
                    btn.disabled = false;
                    alert("Error: " + err);
                })
                .initializeDefaultWeights();
        }

        function showToast(msg, type) {
            const el = document.getElementById('toast');
            const icon = document.getElementById('toastIcon');
            const text = document.getElementById('toastMsg');

            text.innerText = msg;
            icon.innerHTML = type === 'success'
                ? `<svg class="w-5 h-5 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>`
                : `<svg class="w-5 h-5 text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>`;

            el.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => {
                el.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }
    </script>
</body>

</html>
