    <script>
        let map;
        let markers = [];
        let allOrders = [];
        let managerColors = {};
        let isAdmin = false;
        let currentUser = '';
        const colorPalette = [
            '#3b82f6', '#ef4444', '#10b981', '#f59e0b', '#8b5cf6',
            '#ec4899', '#14b8a6', '#f97316', '#6366f1', '#84cc16',
            '#06b6d4', '#a855f7', '#eab308', '#22c55e', '#f43f5e'
        ];

        window.onload = function () {
            initMap();
            loadData();

            // Default to Next 7 Days
            setRange('next', false);
        };

        function initMap() {
            // Center on Thailand roughly
            map = L.map('map').setView([13.7563, 100.5018], 6);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; OpenStreetMap contributors'
            }).addTo(map);
        }

        function loadData() {
            google.script.run
                .withSuccessHandler(function (jsonStr) {
                    try {
                        let res = JSON.parse(jsonStr);
                        if (res.error) { document.getElementById('mapStatus').textContent = "Error: " + res.error; return; }

                        allOrders = res.orders || [];
                        isAdmin = res.isAdmin || false;
                        currentUser = res.user || '';
                        var withGps = allOrders.filter(o => o.gps).length;

                        // Show dashboard for admins
                        if (isAdmin) {
                            document.getElementById('workloadDashboard').style.display = 'block';
                        }

                        // Assign colors to managers
                        assignManagerColors();

                        console.log("API Response:", res);
                        if (res.storeDbStats) {
                            console.log("Store DB Stats:", res.storeDbStats);
                        }
                        if (res.adminLogs) {
                            console.log("Admin Logs:", res.adminLogs);
                        }

                        // DIAGOSTIC INFO
                        var debugText = `Loaded: ${allOrders.length} | With GPS: ${withGps}`;
                        if (res.storeDbStats) {
                            debugText += ` | StoreDB: ${res.storeDbStats.totalGps} entries`;
                        }
                        if (res.debug) debugText += ` | Backend: ${res.debug}`;

                        // Store debug text globally to preserve it
                        window.lastDebugText = debugText;

                        // Warn if high failure rate
                        if (allOrders.length > 0 && withGps === 0) {
                            debugText += " (CRITICAL: No GPS matches found. Check Console for details)";
                            document.getElementById('mapStatus').classList.add('text-red-600');
                        }

                        document.getElementById('mapStatus').textContent = debugText;

                        populateFilters();
                        filterMap();

                    } catch (e) {
                        console.error(e);
                        document.getElementById('mapStatus').textContent = "Client Data Error: " + e.message;
                    }
                })
                .withFailureHandler(function (err) {
                    document.getElementById('mapStatus').textContent = "Connection Failed";
                })
                .getAllTripPlansReport(getCurrentUserEmail());
        }

        // Helper to get manual login email
        const getAuthUser = () => {
            const AUTH_USER = 'app_user_data';
            const u = localStorage.getItem(AUTH_USER);
            if (u) {
                try { return JSON.parse(u); } catch (e) { return null; }
            }
            return null;
        };

        const getCurrentUserEmail = () => {
            const user = getAuthUser();
            return user ? user.email : '';
        };

        function setRange(type, trigger = true) {
            const today = new Date();
            const start = new Date();
            const end = new Date();

            if (type === 'next') {
                // Today to Today + 7
                end.setDate(today.getDate() + 7);
            } else if (type === 'today') {
                // Today Only (start and end are already 'today')
            } else {
                // Today - 7 to Today
                start.setDate(today.getDate() - 7);
            }

            document.getElementById('startDate').valueAsDate = start;
            document.getElementById('endDate').valueAsDate = end;

            // Visual feedback on buttons
            // (Simplified for brevity, could add active class toggling)

            if (trigger) filterMap();
        }

        function assignManagerColors() {
            // Sort managers alphabetically to ensure consistent coloring
            const managers = [...new Set(allOrders.map(o => o.managerName).filter(Boolean))].sort();

            // Console log to debug manager list
            console.log("Unique Managers Found:", managers);

            managers.forEach((manager, idx) => {
                managerColors[manager] = colorPalette[idx % colorPalette.length];
            });
        }

        function populateFilters() {
            // Employees: Nickname Fullname
            const rawEmps = allOrders.map(o => ({
                name: o.empName,
                nickname: o.empNickname || ''
            })).filter(o => o.name);

            // Removing duplicatesByKey (name)
            const uniqueEmps = [];
            const seen = new Set();

            rawEmps.forEach(e => {
                if (!seen.has(e.name)) {
                    seen.add(e.name);
                    uniqueEmps.push(e);
                }
            });

            uniqueEmps.sort((a, b) => a.name.localeCompare(b.name));

            const empSel = document.getElementById('filterEmp');
            empSel.innerHTML = '<option value="">All Employees</option>';

            uniqueEmps.forEach(e => {
                let opt = document.createElement('option');
                opt.value = e.name;
                const display = e.nickname ? `${e.nickname} ${e.name}` : e.name;
                opt.textContent = display;
                empSel.appendChild(opt);
            });

            // Teams (Department)
            const teams = [...new Set(allOrders.map(o => o.department).filter(Boolean))].sort();
            const teamSel = document.getElementById('filterTeam');
            teamSel.innerHTML = '<option value="">All Teams</option>';

            teams.forEach(t => {
                let opt = document.createElement('option');
                opt.value = t;
                opt.textContent = t;
                teamSel.appendChild(opt);
            });
        }

        function filterMap() {
            // Clear existing markers
            markers.forEach(m => map.removeLayer(m));
            markers = [];

            const startInput = document.getElementById('startDate').value;
            const endInput = document.getElementById('endDate').value;
            const empInput = document.getElementById('filterEmp').value;
            const teamInput = document.getElementById('filterTeam').value;

            const startDate = startInput ? new Date(startInput) : null;
            if (startDate) startDate.setHours(0, 0, 0, 0); // Fix: Force local midnight to include morning trips

            const endDate = endInput ? new Date(endInput) : null;
            // Set end date to end of day
            if (endDate) endDate.setHours(23, 59, 59, 999);

            let count = 0;
            let bounds = L.latLngBounds();

            allOrders.forEach(order => {
                // 1. Check GPS
                if (!order.gps || !order.gps.includes(',')) return;

                // 2. Check Date Range (using startDate from order)
                if (startDate && endDate) {
                    const orderDate = new Date(order.startDate); // Assuming YYYY-MM-DD format
                    if (isNaN(orderDate) || orderDate < startDate || orderDate > endDate) return;
                }

                // 3. Check Employee (Value matches empName)
                if (empInput && order.empName !== empInput) return;

                // 4. Check Team (Department)
                if (teamInput && order.department !== teamInput) return;

                // Create Marker
                const [lat, lng] = order.gps.split(',').map(Number);
                if (isNaN(lat) || isNaN(lng)) return;

                // Get color for this manager
                const managerColor = managerColors[order.managerName] || '#6b7280';

                // Content
                const popupContent = `
                    <div class="font-sans text-left">
                        <div class="font-bold text-sm text-blue-700 mb-1">${order.project}</div>
                        <div class="text-xs mb-1"><strong>Who:</strong> ${order.empNickname ? order.empNickname + ' ' + order.empName : order.empName}</div>
                        <div class="text-xs mb-1"><strong>Manager/AMM:</strong> <span style="color: ${managerColor}; font-weight: bold;">${order.managerName || '-'}</span></div>
                        <div class="text-xs mb-1"><strong>When:</strong> ${order.startDate}</div>
                        <div class="text-xs mb-1"><strong>Store:</strong> ${order.storeName}</div>
                        <div class="text-xs mb-1"><strong>Team:</strong> ${order.department}</div>
                        <div class="flex gap-2 mt-2">
                             <span class="px-2 py-0.5 rounded text-[10px] font-bold ${getStatusColor(order.status)}">${order.status}</span>
                        </div>
                        ${order.status === 'Rejected' && order.approvedBy && order.approvedBy.includes(':')
                        ? `<div class="text-[10px] text-red-600 mt-1 font-semibold leading-tight max-w-[200px] break-words">Reason: ${order.approvedBy.split(':').slice(1).join(':').trim()}</div>`
                        : ''}
                        <button onclick="showDetails('${order.id}')" class="mt-2 w-full px-3 py-1.5 bg-blue-600 text-white text-xs rounded hover:bg-blue-700 font-medium">
                            View Details & Actions
                        </button>
                    </div>
                `;

                // ... (Marker creation logic remains same) ...

                // Custom colored marker icon
                const customIcon = L.divIcon({
                    className: 'custom-marker',
                    html: `<div style="background-color: ${managerColor}; width: 25px; height: 41px; position: relative; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); border: 2px solid white; box-shadow: 0 2px 5px rgba(0,0,0,0.3);"><div style="position: absolute; width: 10px; height: 10px; background: white; border-radius: 50%; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(45deg);"></div></div>`,
                    iconSize: [25, 41],
                    iconAnchor: [12, 41],
                    popupAnchor: [1, -34]
                });

                const marker = L.marker([lat, lng], { icon: customIcon }).bindPopup(popupContent);
                marker.addTo(map);

                // Label (DivIcon) with manager color
                const labelIcon = L.divIcon({
                    className: 'bg-transparent',
                    html: `<div class="pin-label shadow-sm" style="border-color: ${managerColor}; background: rgba(255,255,255,0.95);">${order.empNickname ? order.empNickname + ' (' + order.empName + ')' : order.empName}</div>`
                });
                const labelMarker = L.marker([lat, lng], {
                    icon: labelIcon,
                    interactive: false, // Click passes through to pin
                    zIndexOffset: 1000
                }).addTo(map);

                markers.push(marker);
                markers.push(labelMarker); // Track both to remove later
                bounds.extend([lat, lng]);
                count++;
            });

            // Update status text
            // Update status text
            var statusText = `Showing ${count} trip plans`;
            if (window.lastDebugText) {
                statusText += ` | ${window.lastDebugText}`;
            }
            document.getElementById('mapStatus').textContent = statusText;

            // Auto-fit map if there are markers
            if (count > 0) {
                map.fitBounds(bounds, { padding: [50, 50] });
            }
        }

        function getStatusColor(status) {
            if (status === 'Pending') return 'bg-yellow-100 text-yellow-800';
            if (status === 'Approved' || status === 'Closed') return 'bg-green-100 text-green-800';
            if (status === 'Rejected') return 'bg-red-100 text-red-800';
            return 'bg-gray-100 text-gray-800';
        }

        function showDetails(orderId) {
            const order = allOrders.find(o => o.id === orderId);
            if (!order) return;

            const managerColor = managerColors[order.managerName] || '#6b7280';
            const canApprove = order.canApprove && (order.status === 'Pending' || order.status === 'Waiting Approval');

            let itineraryHtml = '';
            if (order.itinerary && order.itinerary.length > 0) {
                itineraryHtml = `
                    <div class="mb-4">
                        <div class="font-bold text-gray-700 mb-2 flex items-center gap-2">
                            <svg class="w-5 h-5 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path>
                            </svg>
                            Itinerary
                        </div>
                        ${order.itinerary.map((visit, idx) => `
                            <div class="mb-3 p-3 bg-gray-50 rounded-lg border border-gray-200">
                                <div class="font-semibold text-blue-700 mb-1">📍 Visit #${idx + 1}</div>
                                <div class="text-sm text-gray-700">
                                    <div><strong>When:</strong> ${visit.datetime ? new Date(visit.datetime).toLocaleString('en-GB', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : '-'}</div>
                                    <div><strong>Where:</strong> ${visit.location || '-'}</div>
                                    ${visit.workDocNumber ? `<div><strong>Work Doc:</strong> ${visit.workDocNumber}</div>` : ''}
                                    ${visit.vendor ? `<div><strong>Vendor:</strong> ${visit.vendor}</div>` : ''}
                                    ${visit.priority ? `<div><strong>Priority:</strong> ${visit.priority}</div>` : ''}
                                    ${visit.purpose ? `<div><strong>Purpose:</strong> ${visit.purpose}</div>` : ''}
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
            }

            const modalBody = `
            <div class="space-y-4">
                    <!-- Status Badge -->
                <div class="flex items-center justify-between">
                    <span class="px-3 py-1 rounded-lg text-sm font-bold ${getStatusColor(order.status)}">${order.status}</span>
                    <span class="text-sm text-gray-500">ID: ${order.id}</span>
                </div>

                <!-- Project Info -->
                <div class="bg-blue-50 p-4 rounded-lg border border-blue-200">
                    <h3 class="font-bold text-lg text-blue-900 mb-2">${order.project}</h3>
                    <p class="text-sm text-gray-700">${order.details || '-'}</p>
                </div>

                <!-- Employee Info -->
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <div class="text-xs text-gray-500 font-medium">Employee</div>
                        <div class="text-sm font-semibold text-gray-800">${order.empName}</div>
                        <div class="text-xs text-gray-500">ID: ${order.empId}</div>
                    </div>
                    <div>
                        <div class="text-xs text-gray-500 font-medium">Manager/AMM</div>
                        <div class="text-sm font-semibold" style="color: ${managerColor};">${order.managerName || '-'}</div>
                    </div>
                    <div>
                        <div class="text-xs text-gray-500 font-medium">Department</div>
                        <div class="text-sm text-gray-800">${order.department || '-'}</div>
                    </div>
                    <div>
                        <div class="text-xs text-gray-500 font-medium">Zone</div>
                        <div class="text-sm text-gray-800">${order.zone || '-'}</div>
                    </div>
                </div>

                <!-- Trip Details -->
                <div class="border-t pt-4">
                    <h4 class="font-bold text-gray-700 mb-3">Trip Information</h4>
                    <div class="grid grid-cols-2 gap-3 text-sm">
                        <div>
                            <span class="text-gray-500">Destination:</span>
                            <div class="font-medium text-gray-800">${order.storeName || order.station}</div>
                            ${order.province ? `<div class="text-xs text-gray-500">${order.province}</div>` : ''}
                            ${order.address ? `<div class="text-xs text-gray-500">${order.address}</div>` : ''}
                            ${order.gps ? `<a href="https://maps.google.com/?q=${order.gps}" target="_blank" class="text-blue-600 text-xs underline">📍 View Map</a>` : ''}
                        </div>
                        <div>
                            <span class="text-gray-500">Schedule:</span>
                            <div class="text-xs">
                                <div><strong>Start:</strong> ${order.startDate || '-'}</div>
                                <div><strong>End:</strong> ${order.deadline || '-'}</div>
                            </div>
                        </div>
                        <div>
                            <span class="text-gray-500">Work Type:</span>
                            <div class="font-medium">${order.workType || '-'}</div>
                        </div>
                        <div>
                            <span class="text-gray-500">Priority:</span>
                            <div class="font-medium">${order.priority || '-'}</div>
                        </div>
                        <div>
                            <span class="text-gray-500">Distance:</span>
                            <div class="font-medium">${order.estimatedDistance || '0'} km</div>
                        </div>
                        <div>
                            <span class="text-gray-500">Work Doc:</span>
                            <div class="font-medium text-xs">${order.workDocNumber || '-'}</div>
                        </div>
                        <div>
                            <span class="text-gray-500">Contract:</span>
                            <div class="font-medium text-xs">${order.contract || '-'}</div>
                        </div>
                        <div>
                            <span class="text-gray-500">Vendor:</span>
                            <div class="font-medium text-xs">${order.vendor || '-'}</div>
                        </div>
                    </div>
                </div>

                ${itineraryHtml}

                <!-- Attachments -->
                ${order.creationAttachment ? `
                    <div class="border-t pt-4">
                        <div class="text-sm text-gray-500 mb-2">Creation Attachments:</div>
                        ${order.creationAttachment.split('\n').map(url => `
                            <a href="${url}" target="_blank" class="inline-block mr-2 mb-2">
                                <img src="${url}" class="h-20 w-20 object-cover rounded border" />
                            </a>
                        `).join('')}
                    </div>
                    ` : ''}

                ${order.evidence ? `
                    <div class="border-t pt-4">
                        <div class="text-sm text-gray-500 mb-2">Evidence:</div>
                        <a href="${order.evidence}" target="_blank">
                            <img src="${order.evidence}" class="h-32 w-auto rounded border" />
                        </a>
                    </div>
                    ` : ''}

                <!-- Approval/Rejection Section -->
                ${order.approvedBy ? `
                    <div class="${order.status === 'Rejected' ? 'bg-red-50 border-red-200' : 'bg-gray-50 p-3 rounded-lg border'} border p-3 rounded-lg">
                        <div class="text-sm ${order.status === 'Rejected' ? 'text-red-800' : 'text-gray-800'}">
                            <strong>${order.status === 'Rejected' ? 'Rejected By:' : 'Approved By:'}</strong> ${order.approvedBy} (${order.approvedByRole || 'Manager'})
                        </div>
                        <div class="text-sm text-gray-500"><strong>Date:</strong> ${order.approvalDate || '-'}</div>
                        ${order.rating ? `<div class="text-sm text-yellow-600"><strong>Rating:</strong> ${'⭐'.repeat(order.rating)}</div>` : ''}
                    </div>
                    ` : ''}

                <!-- Action Buttons -->
                ${canApprove ? `
                    <div class="border-t pt-4">
                        <div class="bg-yellow-50 border border-yellow-200 p-3 rounded-lg mb-3">
                            <p class="text-sm text-yellow-800">⚠️ This trip plan requires your approval.</p>
                        </div>
                        <div class="mb-3">
                            <label class="block text-sm font-medium text-gray-700 mb-1">Rating (Optional)</label>
                            <select id="ratingInput" class="w-full border rounded p-2 text-sm">
                                <option value="">No Rating</option>
                                <option value="1">⭐ Poor</option>
                                <option value="2">⭐⭐ Fair</option>
                                <option value="3">⭐⭐⭐ Good</option>
                                <option value="4">⭐⭐⭐⭐ Very Good</option>
                                <option value="5">⭐⭐⭐⭐⭐ Excellent</option>
                            </select>
                        </div>
                        <div class="flex gap-3">
                            <button onclick="approveOrder('${order.id}')" class="flex-1 px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 font-medium">
                                ✓ Approve
                            </button>
                            <button onclick="rejectOrder('${order.id}')" class="flex-1 px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 font-medium">
                                ✗ Reject
                            </button>
                        </div>
                    </div>
                    ` : ''}

                <!-- Admin Actions -->
                ${isAdmin ? `
                    <div class="border-t pt-4">
                        <div class="text-xs text-gray-500 font-bold mb-2 uppercase">Admin / Manager Actions</div>
                        <div class="flex gap-3">
                            <button onclick='openEditModal(${JSON.stringify(order).replace(/'/g, "&#39;")})' class="flex-1 px-4 py-2 bg-blue-100 text-blue-700 rounded-lg hover:bg-blue-200 font-medium flex items-center justify-center gap-2">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
                                Edit
                            </button>
                            <button onclick="handleDelete('${order.id}')" class="flex-1 px-4 py-2 bg-red-100 text-red-700 rounded-lg hover:bg-red-200 font-medium flex items-center justify-center gap-2">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                                Delete
                            </button>
                        </div>
                    </div>
                    ` : ''}
            </div>
            `;

            document.getElementById('modalTitle').textContent = order.project;
            document.getElementById('modalBody').innerHTML = modalBody;
            document.getElementById('detailModal').style.display = 'block';
        }

        function closeModal() {
            document.getElementById('detailModal').style.display = 'none';
        }

        function approveOrder(orderId) {
            const rating = document.getElementById('ratingInput')?.value || '';

            if (!confirm('Are you sure you want to approve this trip plan?')) return;

            const approverName = currentUser || 'Manager';

            google.script.run
                .withSuccessHandler(function (result) {
                    if (result.success) {
                        alert('Trip plan approved successfully!');
                        closeModal();
                        loadData(); // Reload data
                    } else {
                        alert('Error: ' + (result.error || 'Unknown error'));
                    }
                })
                .withFailureHandler(function (err) {
                    alert('Connection error: ' + err.message);
                })
                .approveTripPlan(orderId, approverName, rating, getCurrentUserEmail());
        }

        function rejectOrder(orderId) {
            const reason = prompt('Please enter rejection reason (optional):');
            if (reason === null) return; // Cancelled

            const rejectorName = currentUser || 'Manager';

            google.script.run
                .withSuccessHandler(function (result) {
                    if (result.success) {
                        alert('Trip plan rejected successfully!');
                        closeModal();
                        loadData(); // Reload data
                    } else {
                        alert('Error: ' + (result.error || 'Unknown error'));
                    }
                })
                .withFailureHandler(function (err) {
                    alert('Connection error: ' + err.message);
                })
                .rejectTripPlan(orderId, rejectorName, reason || '', getCurrentUserEmail());
        }

        function handleDelete(id) {
            if (!confirm('Are you sure you want to PERMANENTLY DELETE this trip plan? This action cannot be undone.')) return;

            google.script.run.withSuccessHandler(res => {
                if (res.success) {
                    alert('Deleted successfully.');
                    closeModal();
                    loadData();
                } else {
                    alert('Error: ' + res.error);
                }
            }).withFailureHandler(err => {
                alert('System Error: ' + err);
            }).deleteTripPlan(id, getCurrentUserEmail());
        }

        // --- Edit Modal Logic (Copied from Report) ---
        function openEditModal(order) {
            // Populate Edit Form (We need to inject the Edit Modal HTML first, see below)
            const editModal = document.getElementById('editModal');
            document.getElementById('editOrderId').value = order.id;
            document.getElementById('editProject').value = order.project || '';
            document.getElementById('editDetails').value = order.details || '';
            document.getElementById('editStatus').value = order.status || 'Pending';

            // Safe Date Format
            const fmtDate = (dStr) => {
                if (!dStr || dStr === '-') return '';
                const d = new Date(dStr);
                if (isNaN(d)) return '';
                return d.toISOString().split('T')[0];
            };
            document.getElementById('editStart').value = fmtDate(order.startDate);
            document.getElementById('editEnd').value = fmtDate(order.deadline);

            editModal.classList.remove('hidden');
        }

        function closeEditModal() {
            document.getElementById('editModal').classList.add('hidden');
        }

        function submitEdit() {
            const id = document.getElementById('editOrderId').value;
            const form = {
                id: id,
                project: document.getElementById('editProject').value,
                details: document.getElementById('editDetails').value,
                status: document.getElementById('editStatus').value,
                startDate: document.getElementById('editStart').value,
                deadline: document.getElementById('editEnd').value
            };

            if (!confirm('Save changes?')) return;

            google.script.run.withSuccessHandler(res => {
                if (res.success) {
                    alert('Updated successfully');
                    closeEditModal();
                    closeModal(); // Close detail modal too
                    loadData();
                } else {
                    alert('Update Failed: ' + res.error);
                }
            }).withFailureHandler(err => {
                alert('System Error: ' + err);
            }).updateTripPlan(form, getCurrentUserEmail());
        }

        // --- Workload Dashboard Functions ---
        let workloadData = [];

        function setDashboardRange(direction) {
            const today = new Date();
            const start = new Date(today);
            const end = new Date(today);

            if (direction === 'next') {
                // Today to Today + 7
                end.setDate(today.getDate() + 7);
            } else {
                // Today - 7 to Today
                start.setDate(today.getDate() - 7);
            }

            document.getElementById('dashboardStartDate').valueAsDate = start;
            document.getElementById('dashboardEndDate').valueAsDate = end;

            loadWorkloadStats();
        }

        function toggleDashboard() {
            const content = document.getElementById('dashboardContent');
            const chevron = document.getElementById('dashboardChevron');

            if (content.style.display === 'none') {
                content.style.display = 'block';
                chevron.style.transform = 'rotate(180deg)';

                // Initialize dashboard dates to Next 7 Days if not set
                if (!document.getElementById('dashboardStartDate').value) {
                    setDashboardRange('next');
                }

                // Load data if not already loaded
                if (workloadData.length === 0) {
                    loadWorkloadStats();
                }
            } else {
                content.style.display = 'none';
                chevron.style.transform = 'rotate(0deg)';
            }
        }

        function loadWorkloadStats() {
            const loading = document.getElementById('dashboardLoading');
            const table = document.getElementById('dashboardTable');

            loading.style.display = 'block';
            table.style.display = 'none';

            // Get dashboard-specific date range
            const startDate = document.getElementById('dashboardStartDate').value;
            const endDate = document.getElementById('dashboardEndDate').value;

            google.script.run
                .withSuccessHandler(function (jsonStr) {
                    try {
                        const result = JSON.parse(jsonStr);

                        if (result.error) {
                            alert('Error: ' + result.error);
                            loading.innerHTML = '<p class="text-red-600">Error loading statistics</p>';
                            return;
                        }

                        workloadData = result.stats || [];
                        filterDashboard();

                    } catch (e) {
                        console.error(e);
                        loading.innerHTML = '<p class="text-red-600">Error parsing data</p>';
                    }
                })
                .withFailureHandler(function (err) {
                    loading.innerHTML = '<p class="text-red-600">Connection failed</p>';
                })
                .getTeamWorkloadStats(getCurrentUserEmail(), startDate, endDate);
        }

        function filterDashboard() {
            const teamFilter = document.getElementById('teamFilter').value;
            const workloadTypeFilter = document.getElementById('workloadTypeFilter').value;
            let filtered = workloadData;

            // Filter by team
            if (teamFilter !== 'All') {
                filtered = filtered.filter(emp => emp.team === teamFilter);
            }

            renderDashboard(filtered, workloadTypeFilter);
        }

        function renderDashboard(data, workloadTypeFilter) {
            const loading = document.getElementById('dashboardLoading');
            const table = document.getElementById('dashboardTable');
            const tbody = document.getElementById('statsTableBody');
            const tfoot = document.getElementById('statsTableFooter');

            loading.style.display = 'none';
            table.style.display = 'block';

            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="text-center py-8 text-gray-500">No data available</td></tr>';
                tfoot.innerHTML = '';
                return;
            }

            // Calculate totals
            let totalTrips = 0;
            let totalDistance = 0;

            // Default to 'Both' if not specified
            workloadTypeFilter = workloadTypeFilter || 'Both';

            // Render rows
            tbody.innerHTML = data.map(emp => {
                totalTrips += emp.tripCount;
                totalDistance += emp.totalDistance;

                // Determine workload level based on filter type
                let workloadClass = 'bg-green-100 text-green-800';
                let workloadText = 'Low';
                let workloadValue = 0;

                if (workloadTypeFilter === 'TripPlan') {
                    // Trip Plan workload based on distance only
                    workloadValue = emp.totalDistance;
                    if (emp.totalDistance > 500) {
                        workloadClass = 'bg-red-100 text-red-800';
                        workloadText = 'High';
                    } else if (emp.totalDistance > 200) {
                        workloadClass = 'bg-yellow-100 text-yellow-800';
                        workloadText = 'Medium';
                    }
                } else if (workloadTypeFilter === 'SiteVisit') {
                    // Trip Plan workload based on trip count only
                    workloadValue = emp.tripCount;
                    if (emp.tripCount > 10) {
                        workloadClass = 'bg-red-100 text-red-800';
                        workloadText = 'High';
                    } else if (emp.tripCount > 5) {
                        workloadClass = 'bg-yellow-100 text-yellow-800';
                        workloadText = 'Medium';
                    }
                } else {
                    // Both - combined workload
                    if (emp.tripCount > 10 || emp.totalDistance > 500) {
                        workloadClass = 'bg-red-100 text-red-800';
                        workloadText = 'High';
                    } else if (emp.tripCount > 5 || emp.totalDistance > 200) {
                        workloadClass = 'bg-yellow-100 text-yellow-800';
                        workloadText = 'Medium';
                    }
                }

                // Team badge color
                let teamBadge = 'bg-gray-100 text-gray-800';
                if (emp.team === 'SMF') teamBadge = 'bg-blue-100 text-blue-800';
                if (emp.team === 'MMS') teamBadge = 'bg-purple-100 text-purple-800';

                // Format name with nickname
                let displayName = emp.name;
                if (emp.nickname) {
                    displayName = `${emp.nickname} (${emp.name})`;
                }

                return `
            <tr class="hover:bg-gray-50 transition">
                <td class="px-4 py-3 font-medium text-gray-900">${displayName}</td>
                <td class="px-4 py-3 text-center">
                    <span class="px-2 py-1 rounded-full text-xs font-semibold ${teamBadge}">${emp.team}</span>
                </td>
                <td class="px-4 py-3 text-center font-semibold text-gray-700">${emp.tripCount}</td>
                <td class="px-4 py-3 text-center font-semibold text-gray-700">${emp.totalDistance}</td>
                <td class="px-4 py-3 text-center">
                    <span class="px-2 py-1 rounded-full text-xs font-semibold ${workloadClass}">${workloadText}</span>
                </td>
            </tr>
            `;
            }).join('');

            // Render totals
            tfoot.innerHTML = `
            <tr>
                <td class="px-4 py-3 font-bold text-gray-900" colspan="2">TOTAL</td>
                <td class="px-4 py-3 text-center font-bold text-gray-900">${totalTrips}</td>
                <td class="px-4 py-3 text-center font-bold text-gray-900">${Math.round(totalDistance * 10) / 10}</td>
                <td class="px-4 py-3"></td>
            </tr>
            `;
        }

        // Close modal when clicking outside
        window.onclick = function (event) {
            const modal = document.getElementById('detailModal');
            if (event.target === modal) {
                closeModal();
            }
        }

    </script>
</body>

</html>
