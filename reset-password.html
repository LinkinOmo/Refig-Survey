<!DOCTYPE html>
<html>

<head>
    <base target="_top">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Roboto', sans-serif; background-color: #f3f4f6; }
    </style>
</head>

<body class="min-h-screen flex items-center justify-center p-4">

    <div class="bg-white rounded-xl shadow-2xl max-w-sm w-full p-8">

        <div id="checkingState" class="text-center py-6">
            <svg class="w-8 h-8 animate-spin text-blue-600 mx-auto mb-3" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <p class="text-gray-500 text-sm">กำลังตรวจสอบลิงก์...</p>
        </div>

        <div id="invalidState" class="hidden text-center py-4">
            <div class="text-5xl mb-3">⚠️</div>
            <h2 class="text-lg font-bold text-gray-800 mb-1">ลิงก์ใช้ไม่ได้</h2>
            <p id="invalidMsg" class="text-gray-500 text-sm mb-6">ลิงก์นี้หมดอายุหรือไม่ถูกต้อง</p>
            <a href="<?= ScriptApp.getService().getUrl() ?>" class="inline-block bg-blue-600 text-white px-6 py-2.5 rounded-lg hover:bg-blue-700 transition font-semibold text-sm">กลับไปหน้าเข้าสู่ระบบ</a>
        </div>

        <form id="resetForm" class="hidden" onsubmit="submitReset(event)">
            <div class="text-center mb-6">
                <h2 class="text-2xl font-bold text-gray-800">ตั้งรหัสผ่านใหม่</h2>
                <p class="text-gray-500 text-sm mt-1" id="forEmail"></p>
            </div>

            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">รหัสผ่านใหม่</label>
                <input type="password" id="newPassword" required minlength="4"
                    class="w-full border border-gray-300 p-2.5 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition"
                    placeholder="อย่างน้อย 4 ตัวอักษร">
            </div>
            <div class="mb-5">
                <label class="block text-sm font-medium text-gray-700 mb-1">ยืนยันรหัสผ่านใหม่</label>
                <input type="password" id="confirmPassword" required minlength="4"
                    class="w-full border border-gray-300 p-2.5 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition"
                    placeholder="พิมพ์รหัสผ่านอีกครั้ง">
            </div>

            <div id="resetError" class="hidden text-red-500 text-sm text-center bg-red-50 p-2 rounded mb-4"></div>

            <button type="submit" id="resetBtn"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-lg transition-colors flex items-center justify-center gap-2">
                <span id="resetBtnLabel">ตั้งรหัสผ่านใหม่</span>
            </button>
        </form>

        <div id="successState" class="hidden text-center py-4">
            <div class="text-5xl mb-3">✅</div>
            <h2 class="text-lg font-bold text-gray-800 mb-1">ตั้งรหัสผ่านสำเร็จ</h2>
            <p class="text-gray-500 text-sm mb-6">คุณสามารถเข้าสู่ระบบด้วยรหัสผ่านใหม่ได้ทันที</p>
            <a href="<?= ScriptApp.getService().getUrl() ?>" class="inline-block bg-blue-600 text-white px-6 py-2.5 rounded-lg hover:bg-blue-700 transition font-semibold text-sm">ไปหน้าเข้าสู่ระบบ</a>
        </div>

    </div>

    <script>
        const TOKEN = <?!= JSON.stringify(token) ?>;

        function showState(id) {
            ['checkingState', 'invalidState', 'resetForm', 'successState'].forEach(function (s) {
                document.getElementById(s).classList.toggle('hidden', s !== id);
            });
        }

        document.addEventListener('DOMContentLoaded', function () {
            if (!TOKEN) {
                document.getElementById('invalidMsg').textContent = 'ไม่พบลิงก์รีเซ็ตรหัสผ่าน';
                showState('invalidState');
                return;
            }
            google.script.run
                .withSuccessHandler(function (res) {
                    if (res && res.valid) {
                        document.getElementById('forEmail').textContent = res.email || '';
                        showState('resetForm');
                    } else {
                        document.getElementById('invalidMsg').textContent = (res && res.error) || 'ลิงก์นี้หมดอายุหรือไม่ถูกต้อง';
                        showState('invalidState');
                    }
                })
                .withFailureHandler(function (err) {
                    document.getElementById('invalidMsg').textContent = 'เกิดข้อผิดพลาด: ' + err.message;
                    showState('invalidState');
                })
                .validateResetToken(TOKEN);
        });

        function submitReset(e) {
            e.preventDefault();
            const pwd = document.getElementById('newPassword').value;
            const confirm = document.getElementById('confirmPassword').value;
            const errEl = document.getElementById('resetError');
            errEl.classList.add('hidden');

            if (pwd !== confirm) {
                errEl.textContent = 'รหัสผ่านทั้งสองช่องไม่ตรงกัน';
                errEl.classList.remove('hidden');
                return;
            }

            const btn = document.getElementById('resetBtn');
            const label = document.getElementById('resetBtnLabel');
            btn.disabled = true;
            label.textContent = 'กำลังบันทึก...';

            google.script.run
                .withSuccessHandler(function (res) {
                    btn.disabled = false;
                    label.textContent = 'ตั้งรหัสผ่านใหม่';
                    if (res && res.success) {
                        showState('successState');
                    } else {
                        errEl.textContent = (res && res.error) || 'บันทึกไม่สำเร็จ';
                        errEl.classList.remove('hidden');
                    }
                })
                .withFailureHandler(function (err) {
                    btn.disabled = false;
                    label.textContent = 'ตั้งรหัสผ่านใหม่';
                    errEl.textContent = 'Server Error: ' + err.message;
                    errEl.classList.remove('hidden');
                })
                .completePasswordReset(TOKEN, pwd);
        }
    </script>
</body>
</html>
