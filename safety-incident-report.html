<body class="text-slate-800">

                                    d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z">

                            to App</a>
                    </div>
                </div>
            </div>

        <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
            <!-- Loading -->
            <div id="loading" class="text-center py-20">
                <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-red-600 mx-auto mb-4"></div>
                <p class="text-slate-500">Loading Incidents...</p>
            </div>

            <div id="content" class="hidden space-y-6">
                <!-- Stats -->
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-100">
                        <p class="text-sm font-medium text-slate-500">Total Incidents</p>
                        <p id="statTotal" class="text-3xl font-bold text-slate-800 mt-1">0</p>

                    <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-100">

                    <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-100">

                                    <th class="p-4">Date / Station</th>
                                    <th class="p-4">Type / Severity</th>
                                    <th class="p-4">Description</th>

                                    <th class="p-4">Status</th>
                                    <th class="p-4 text-right">Action</th>
                                </tr>
                            </thead>
                            <tbody id="tableBody" class="divide-y divide-slate-100"></tbody>
                        </table>
                    </div>

                </div>

    <!-- Modal -->
    <div id="detailModal" class="hidden fixed inset-0 z-50 overflow-y-auto" aria-labelledby="modal-title" role="dialog"
        aria-modal="true">
        <div class="flex items-end justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:block sm:p-0">
            <div class="fixed inset-0 bg-slate-900 bg-opacity-75 transition-opacity" onclick="closeModal()"></div>
            <div
                class="relative inline-block align-bottom bg-white rounded-xl text-left overflow-hidden shadow-xl transform transition-all sm:my-8 sm:align-middle sm:max-w-2xl sm:w-full">
                <div class="bg-slate-50 px-6 py-4 border-b border-slate-200 flex justify-between items-start">
                    <h3 class="text-lg font-bold text-slate-900">Incident Details</h3>
                    <button onclick="closeModal()" class="text-slate-400 hover:text-slate-500">✕</button>
                </div>
                <div class="px-6 py-6" id="modalContent"></div>

                <!-- Footer / Actions -->
                <div class="bg-gray-50 px-6 py-4 border-t flex flex-col gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Update Status</label>
                        <select id="statusSelect" class="w-full border p-2 rounded text-sm bg-white">
                            <option value="Pending">Pending</option>
                            <option value="Investigating">Investigating</option>
                            <option value="Resolved">Resolved</option>
                            <option value="Closed">Closed</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Follow-up Notes</label>
                        <textarea id="notesInput" class="w-full border p-2 rounded text-sm bg-white" rows="2"
                            placeholder="Add notes..."></textarea>
                    </div>
                    <div class="flex justify-end gap-2">
                        <button onclick="saveChanges()"
                            class="bg-blue-600 text-white px-4 py-2 rounded text-sm font-medium hover:bg-blue-700">Save
                            Changes</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let allIncidents = [];
        let currentId = null;

        window.onload = function () {
            google.script.run
                .withSuccessHandler(init)
                .withFailureHandler(err => alert("Error: " + err))
                .getSafetyIncidentsReport_v2();
        };

        function init(data) {
            // DEBUG ALERT
            // alert("Raw Server Data: " + (typeof data === 'object' ? JSON.stringify(data) : data));

            if (typeof data === 'string') {
                try {
                    data = JSON.parse(data);
                } catch (e) {
                    alert("JSON Parse Error: " + e);
                    return;
                }
            }

            document.getElementById('loading').classList.add('hidden');
            document.getElementById('content').classList.remove('hidden');

            if (data.error) {
                document.getElementById('content').innerHTML = `
                    <div class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded relative" role="alert">
                        <strong class="font-bold">Error loading reports!</strong>
                        <span class="block sm:inline">${data.error}</span>
                    </div>
                `;
                return;
            }
            allIncidents = data.orders || [];
            if (data.debug) window.debugInfo = data.debug;

            updateStats();
            renderTable();
        }

        function updateStats() {
            document.getElementById('statTotal').innerText = allIncidents.length;
            document.getElementById('statPending').innerText = allIncidents.filter(i => i.status === 'Pending').length;
            document.getElementById('statCritical').innerText = allIncidents.filter(i => i.severity === 'High' || i.severity === 'Critical').length;
        }

        function renderTable() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            if (allIncidents.length === 0) {
                // Determine if we have debug info
                let debugHtml = '';
                if (window.debugInfo) {
                    if (!window.debugInfo.sheetFound) {
                        debugHtml = `
                            <div class="mt-4 text-xs text-left bg-slate-100 p-4 rounded border border-slate-300">
                                <p class="font-bold text-red-600">Error: Database Sheet Not Found</p>
                                <p>Script looked for: <b>Safety_Incident_Database</b> or <b>Safety Incident Database</b></p>
                                <p class="mt-2 font-bold">Available Sheets in "${window.debugInfo.activeSpreadsheetName}":</p>
                                <ul class="list-disc ml-4 font-mono text-slate-600">
                                    ${window.debugInfo.availableSheets.map(s => `<li>${s}</li>`).join('')}
                                </ul>
                            </div>
                        `;
                    } else {
                        debugHtml = `
                            <div class="mt-4 text-xs text-left bg-slate-100 p-4 rounded border border-slate-300">
                                <p class="font-bold text-amber-600">Sheet "${window.debugInfo.sheetName}" Found but Empty</p>
                                <p>Rows found: ${window.debugInfo.rowCount}</p>
                                <p>Headers detected: ${window.debugInfo.headers ? window.debugInfo.headers.join(', ') : 'None'}</p>
                            </div>
                        `;
                    }
                }

                document.getElementById('emptyState').innerHTML = `
                    <p>No incidents found.</p>
                    <p class="text-sm mt-2">If you expect data, please ensure the sheet <b>Safety_Incident_Database</b> exists.</p>
                    ${debugHtml}
                `;
                document.getElementById('emptyState').classList.remove('hidden');
                return;
            }
            document.getElementById('emptyState').classList.add('hidden');

            allIncidents.forEach(item => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-50 transition";

                const sevClass = `severity-${item.severity}`;

                tr.innerHTML = `
                    <td class="p-4">
                        <div class="font-bold text-slate-800">${item.station}</div>
                        <div class="text-xs text-slate-500">${item.date} ${item.time}</div>
                    </td>
                    <td class="p-4">
                        <div>${item.type}</div>
                        <span class="text-xs px-2 py-0.5 rounded-full font-bold ${sevClass}">${item.severity}</span>
                    </td>
                    <td class="p-4 max-w-xs truncate text-xs text-slate-600" title="${item.description}">
                        ${item.description}
                    </td>
                    <td class="p-4 text-sm text-slate-700">
                        ${item.recorderName}
                    </td>
                    <td class="p-4">
                        <span class="bg-slate-100 text-slate-700 px-2 py-1 rounded text-xs font-medium border border-slate-200">${item.status}</span>
                    </td>
                    <td class="p-4 text-right">
                        <button onclick='openModal(${JSON.stringify(item)})' class="text-blue-600 hover:underline text-sm font-medium">View</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function openModal(item) {
            currentId = item.id;
            const content = document.getElementById('modalContent');

            let photosHtml = '';
            if (item.attachments && item.attachments.length > 0) {
                photosHtml = `<div class="mb-4"><h5 class="text-xs font-bold text-slate-500 uppercase mb-2">Photos</h5><div class="flex gap-2 overflow-x-auto">`;
                item.attachments.forEach(url => {
                    photosHtml += `<a href="${url}" target="_blank"><img src="${url}" class="h-20 w-20 object-cover rounded border hover:opacity-80"></a>`;
                });
                photosHtml += `</div></div>`;
            }

            content.innerHTML = `
                <div class="space-y-4 text-sm">
                    <div class="grid grid-cols-2 gap-4 bg-slate-50 p-3 rounded border">
                        <div><span class="block text-xs text-slate-500">Station</span><span class="font-bold">${item.station}</span></div>
                        <div><span class="block text-xs text-slate-500">Date/Time</span><span class="font-bold">${item.date} ${item.time}</span></div>
                        <div><span class="block text-xs text-slate-500">Type</span><span class="font-bold">${item.type}</span></div>
                        <div><span class="block text-xs text-slate-500">Severity</span><span class="font-bold">${item.severity}</span></div>
                    </div>
                    <div>
                        <h5 class="text-xs font-bold text-slate-500 uppercase mb-1">Description</h5>
                        <p class="bg-white p-3 rounded border text-slate-700">${item.description}</p>
                    </div>
                    <div>
                        <h5 class="text-xs font-bold text-slate-500 uppercase mb-1">Immediate Action Taken</h5>
                        <p class="bg-white p-3 rounded border text-slate-700">${item.action}</p>
                    </div>
                    ${photosHtml}
                </div>
            `;

            document.getElementById('statusSelect').value = item.status;
            document.getElementById('notesInput').value = item.followup.notes || '';

            document.getElementById('detailModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('detailModal').classList.add('hidden');
        }

        function saveChanges() {
            const status = document.getElementById('statusSelect').value;
            const notes = document.getElementById('notesInput').value;

            google.script.run
                .withSuccessHandler(res => {
                    if (res.success) {
                        alert("Updated successfully");
                        closeModal();
                        location.reload(); // Simple reload to refresh table
                    } else {
                        alert("Error: " + res.error);
                    }
                })
                .updateSafetyIncident({ id: currentId, status: status, notes: notes });
        }
    </script>
</body>
