  #chap{position:absolute;left:24px;top:20px;padding:8px 18px;border-radius:12px;background:rgba(15,23,42,.85);color:#fff;font-size:22px;font-weight:700;border-left:6px solid #84cc16}
  #brand{position:absolute;right:24px;top:22px;color:#fff;font-size:15px;font-weight:700;background:rgba(15,23,42,.7);padding:6px 12px;border-radius:999px}

  #fade{position:absolute;inset:0;background:#000;pointer-events:none}
  #ov{position:absolute;inset:0;display:none}
  .ovbg{position:absolute;inset:0;background:radial-gradient(1000px 620px at 50% 42%,rgba(54,83,20,.92),rgba(12,22,6,.97))}
  .ovw{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;padding:0 50px 100px}
