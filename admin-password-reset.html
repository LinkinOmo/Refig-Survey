    <script>
        // All users loaded from backend
        let allUsers = [];

        // Wait for DOM to be fully loaded
        document.addEventListener('DOMContentLoaded', function() {
            // If already logged in (from auth.html's checkAuth), trigger the UI update now
            if (typeof CURRENT_USER !== 'undefined' && CURRENT_USER) {
                updateUserUI(CURRENT_USER);
            }
        });

        // Called by auth.html after successful login OR by our DOMContentLoaded listener
        function updateUserUI(user) {
            const display = document.getElementById('user-email-display');
            if (display) display.textContent = user.name || user.email;

            const mainPage = document.getElementById('main-page');
            const accessDenied = document.getElementById('access-denied');

            if (!user || !user.isAdmin) {
                if (accessDenied) accessDenied.classList.remove('hidden');
                if (mainPage) mainPage.classList.add('hidden');
                return;
            }

            if (mainPage) mainPage.classList.remove('hidden');
            if (accessDenied) accessDenied.classList.add('hidden');
            loadUsers();
        }

        function loadUsers() {
            const sel = document.getElementById('userSelect');
            if (!sel) return;
            sel.innerHTML = '<option value="">-- Loading... --</option>';

            google.script.run
                .withSuccessHandler(function(list) {
                    allUsers = list || [];
                    populateSelect(allUsers);
                })
                .withFailureHandler(function(err) {
                    sel.innerHTML = '<option value="">Error loading users</option>';
                })
                .getEmployeeListForReset();
        }

        function populateSelect(users) {
            const sel = document.getElementById('userSelect');
            if (!sel) return;
            if (!users || users.length === 0) {
                sel.innerHTML = '<option value="">No users found</option>';
                return;
            }
            sel.innerHTML = '<option value="">-- Select a user --</option>' +
                users.map(u => `<option value="${escHtml(u.email)}">${escHtml(u.display)}</option>`).join('');
        }

        function filterUsers() {
            const q = document.getElementById('searchInput').value.toLowerCase().trim();
            if (!q) {
                populateSelect(allUsers);
                return;
            }
            const filtered = allUsers.filter(u =>
                (u.display && u.display.toLowerCase().includes(q)) || 
                (u.email && u.email.toLowerCase().includes(q))
            );
            populateSelect(filtered);
        }

        function handleReset() {
            const userSelect = document.getElementById('userSelect');
            const targetEmail = userSelect ? userSelect.value : '';
            const newPwd = document.getElementById('newPassword').value;
            const confirmPwd = document.getElementById('confirmPassword').value;
            const btn = document.getElementById('resetBtn');
            const btnText = document.getElementById('resetBtnText');
            const statusMsg = document.getElementById('statusMsg');

            if (!statusMsg) return;
            statusMsg.classList.add('hidden');

            if (!targetEmail) { showStatus('Please select a user.', 'error'); return; }
            if (!newPwd) { showStatus('Please enter a new password.', 'error'); return; }
            if (newPwd.length < 4) { showStatus('Password must be at least 4 characters.', 'error'); return; }
            if (newPwd !== confirmPwd) { showStatus('Passwords do not match.', 'error'); return; }

            if (!confirm('Reset password for:\n' + targetEmail + '\n\nContinue?')) return;

            if (!CURRENT_USER || !CURRENT_USER.email) {
                showStatus('Session error. Please refresh and log in again.', 'error');
                return;
            }

            btn.disabled = true;
            btnText.textContent = 'Resetting...';

            google.script.run
                .withSuccessHandler(function(res) {
                    btn.disabled = false;
                    btnText.textContent = 'Reset Password';
                    if (res && res.success) {
                        showStatus('Password reset successfully for ' + targetEmail, 'success');
                        document.getElementById('newPassword').value = '';
                        document.getElementById('confirmPassword').value = '';
                        document.getElementById('userSelect').value = '';
                        document.getElementById('searchInput').value = '';
                        populateSelect(allUsers);
                    } else {
                        showStatus('Error: ' + (res ? res.error : 'Unknown error'), 'error');
                    }
                })
                .withFailureHandler(function(err) {
                    btn.disabled = false;
                    btnText.textContent = 'Reset Password';
                    showStatus('System Error: ' + err, 'error');
                })
                .adminResetPassword(CURRENT_USER.email, targetEmail, newPwd);
        }

        function showStatus(msg, type) {
            const el = document.getElementById('statusMsg');
            el.textContent = msg;
            el.className = 'mb-4 p-3 rounded-lg text-sm text-center font-medium ' +
                (type === 'success' ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800');
            el.classList.remove('hidden');
        }

        function toggleVisibility(inputId, iconId) {
            const input = document.getElementById(inputId);
            input.type = input.type === 'password' ? 'text' : 'password';
        }

        function escHtml(str) {
            return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }
    </script>

</body>
